       en:"Look at the <b>lunch needs</b> row under the grid: Tuesday shows <b>KIT 1/1</b> but <b>FOH 0/1</b>. The kitchen is covered, the floor isn't. Place <b>Claire</b>'s split on Tuesday."},
  check:(p)=>p.s1[1]==='C'},
 {txt:{fr:"Mardi est complet. Faites de même pour <b>mercredi, jeudi et vendredi</b>. Vous pouvez rester appuyé et glisser sur plusieurs cases.",
       en:"Tuesday is covered. Do the same for <b>Wednesday, Thursday and Friday</b>. You can hold and drag across cells."},
  check:(p)=>[2,3,4].every(d=>p.c1[d]==='C'&&p.s1[d]==='C')},
 {txt:{fr:"Colonne <b>Total</b> à droite : <b>39 h sur 39 h</b>, exactement le contrat. Ni heure supplémentaire, ni heure payée dans le vide. Le score est à 100.",
       en:"<b>Total</b> column on the right: <b>39h of 39h</b>, exactly the contract. No overtime, no paid idle hours. The score is 100."},
  info:true},
 {txt:{fr:"Maintenant provoquons une infraction. Mettez <b>Soir</b> sur le mercredi de Marc, puis <b>Prépa</b> sur son jeudi.",
       en:"Now let's trigger a breach. Put <b>Dinner</b> on Marc's Wednesday, then <b>Prep</b> on his Thursday."},
  check:(p,ev)=>ev.issues.some(i=>i.code==='REST')},
 {txt:{fr:"Les deux cases passent en rouge : le soir finit à 23:45, la prépa reprend à 08:00, soit <b>8 h 15 de repos</b> au lieu des 11 h légales. Remettez deux <b>coupures</b> pour revenir à 100.",
       en:"Both cells turn red: dinner ends at 23:45, prep starts at 08:00, giving <b>8h15 of rest</b> instead of the legal 11. Put two <b>splits</b> back to return to 100."},
  check:(p,ev)=>ev.score===100},
];
let tuStep=0;

function startTutorial(){
  tuStep=0;
  startScenario(TUTORIAL,'tuto');
}
function renderTutobar(ev){
  const bar=$('#tutobar');
  if(replayInfo){
    bar.hidden=false; bar.className='tutobar replay';
    bar.innerHTML=`<span class="tk">${t('rpTtl')(replayInfo.pseudo,replayInfo.score)}</span>
      <span class="tt">${t('rpSub')}</span>
      <button class="tbtn go" id="rp-quit" type="button">${t('rpQuit')}</button>`;
    $('#rp-quit').onclick=()=>{ replayInfo=null; show('board'); };
    return;
  }
  bar.className='tutobar';
  if(mode!=='tuto'){ bar.hidden=true; return; }
  bar.hidden=false;
  const fini = tuStep>=TU_STEPS.length;
  if(fini){
    bar.innerHTML=`<span class="tk">${t('tuDone')}</span>
      <span class="tt">${t('tuFin')}</span>
      <button class="tbtn go" id="tu-go" type="button">${t('tuGoLevel')}</button>`;
    $('#tu-go').onclick=()=>{ startScenario(LEVELS[0],'levels'); };
    return;
  }
  const st=TU_STEPS[tuStep];
  const ok = st.info ? true : st.check(plan,ev);
  bar.innerHTML=`<span class="tk">${t('tuStep')(tuStep+1,TU_STEPS.length)}</span>
    <span class="tt">${X(st.txt)}</span>
    ${ok&&st.info?`<button class="tbtn go" id="tu-next" type="button">${t('tuNext')}</button>`:''}
    ${ok&&!st.info?`<span class="tdone">✓</span>`:''}
    <button class="tbtn" id="tu-skip" type="button">${t('tuSkip')}</button>`;
  const nx=$('#tu-next'); if(nx) nx.onclick=()=>{ tuStep++; renderPlay(); };
  $('#tu-skip').onclick=()=>{ progress.tuto=100; save(); pushProgress(); show('home'); };
  // les étapes à condition s'enchaînent d'elles-mêmes
  if(ok && !st.info){
    setTimeout(()=>{
      if(mode!=='tuto') return;
      const e2=evaluate(scen,plan);
      if(TU_STEPS[tuStep] && !TU_STEPS[tuStep].info && TU_STEPS[tuStep].check(plan,e2)){
        tuStep++;
        if(tuStep>=TU_STEPS.length){ progress.tuto=100; save(); pushProgress(); }
        renderPlay();
      }
    },700);
  }
}

/* ---------- compte, classements, enregistrement ---------- */
let me = null;            // { id, email, pseudo } ou null
let replayInfo = null;    // grille consultée dans le classement, lecture seule
let boardRef = 'l1';      // onglet de classement courant

function refreshAccount(){
  const label = me ? (me.pseudo || me.email) : t('signIn');
  ['#accountbtn','#accountbtn2'].forEach(sel=>{
    const el=$(sel); if(el) el.textContent=label;
  });
}

function openAuth(){
  if(me){ openAccount(); return; }
  let up = false;                       // false = connexion, true = inscription
  const ovl=document.createElement('div');
  ovl.className='ovl';
  const draw=()=>{
    ovl.innerHTML=`
      <div class="sheet" role="dialog" aria-modal="true" style="max-width:420px">
        <header><div class="ek">PlanningMaster</div>
          <h2>${up?t('authTtlUp'):t('authTtlIn')}</h2></header>
        <div class="body">
          <div class="field"><label for="au-mail">${t('fEmail')}</label>
            <input type="text" id="au-mail" autocomplete="email" inputmode="email"></div>
          <div class="field"><label for="au-pass">${t('fPass')}</label>
            <input type="password" id="au-pass" autocomplete="${up?'new-password':'current-password'}"></div>
          ${up?`<div class="field"><label for="au-pseudo">${t('fPseudo')}</label>
            <input type="text" id="au-pseudo" maxlength="24" autocomplete="nickname"></div>`:''}
          <p id="au-err" class="disclaim" style="color:var(--bad);border:0;padding:0" hidden></p>
          <button class="btn" id="au-swap" type="button"
            style="background:none;border:0;padding:0;color:var(--ink-2);text-align:left;text-decoration:underline">
            ${up?t('goIn'):t('goUp')}</button>
        </div>
        <footer>
          <button class="btn" id="au-cancel" type="button">${t('authCancel')}</button>
          <button class="btn primary" id="au-go" type="button">${t('authGo')}</button>
        </footer>
      </div>`;
    ovl.querySelector('#au-cancel').onclick=()=>ovl.remove();
    ovl.querySelector('#au-swap').onclick=()=>{ up=!up; draw(); };
    ovl.querySelector('#au-go').onclick=go;
    ovl.querySelectorAll('input').forEach(i=>{
      i.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
    });
  };
  const fail=(msg)=>{
    const p=ovl.querySelector('#au-err');
    p.textContent=msg; p.hidden=false;
  };
  async function go(){
    const mail=(ovl.querySelector('#au-mail').value||'').trim();
    const pass=ovl.querySelector('#au-pass').value||'';
    const pseudo=up?(ovl.querySelector('#au-pseudo').value||'').trim():'';
    if(!mail || !pass) return fail(t('authBad'));
    if(up && pass.length<6) return fail(t('authShort'));
    const btn=ovl.querySelector('#au-go'); btn.disabled=true;
    try{
      if(up){
        const r=await cloud.signUp(mail,pass,pseudo||mail.split('@')[0]);
        if(!r.confirmed){ ovl.remove(); toast(t('authMail')); return; }
      } else {
        await cloud.signIn(mail,pass);
      }
      me=cloud.currentUser();
      await pullProgress();
      ovl.remove(); refreshAccount(); show(screen);
      toast(t('authDone')(me.pseudo||me.email));
    }catch(err){
      btn.disabled=false;
      fail(String(err.message||err).includes('6') ? t('authShort') : t('authBad'));
    }
  }
  draw();
  mountOvl(ovl);
  setTimeout(()=>{ const el=ovl.querySelector('#au-mail'); if(el) el.focus(); },30);
}

function openAccount(){
  const ovl=document.createElement('div');
  ovl.className='ovl';
  ovl.innerHTML=`
    <div class="sheet" role="dialog" aria-modal="true" style="max-width:420px">
      <header><div class="ek">${t('account')}</div><h2>${me.pseudo||me.email}</h2></header>
      <div class="body"><p class="disclaim" style="border:0;padding:0">${me.email}</p></div>
      <footer>
        <button class="btn" id="ac-close" type="button">${t('authCancel')}</button>
        <button class="btn primary" id="ac-out" type="button">${t('signOut')}</button>
      </footer>
    </div>`;
  ovl.querySelector('#ac-close').onclick=()=>ovl.remove();
  ovl.querySelector('#ac-out').onclick=async()=>{
    await cloud.signOut(); me=null; ovl.remove(); refreshAccount(); show(screen);
  };
  mountOvl(ovl);
}

/* --- progression : le nuage fait autorité au moment de la connexion --- */
async function pullProgress(){
  try{
    const d=await cloud.loadProgress();
    if(d && typeof d==='object'){
      if(d.progress) progress=Object.assign({},progress,d.progress);
      if(d.season) season=d.season;
      save();
    } else {
      await cloud.saveProgress({progress,season});
    }
  }catch(_){}
}
async function pushProgress(){
  if(!me) return;
  try{ await cloud.saveProgress({progress,season}); }catch(_){}
}

/* --- envoi d'une grille pour vérification --- */
async function submitCurrent(ev){
  if(!me){ toast(t('needAuth')); return; }
  if(ev.issues.some(i=>i.cat==='legal')){ toast(t('sentLegal')); return; }
  let payload=null;
  if(mode==='levels') payload={mode:'level', ref:scen.id, grid:plan};
  else if(mode==='random'||mode==='daily') payload={mode:'seed', ref:`${scen.seed}:${scen.diff}`, grid:plan};
  else return;
  try{
    const r=await cloud.submitScore(payload);
    toast(r.improved ? t('sentBetter')(r.score) : t('sentWorse')(r.best));
  }catch(_){ toast(t('sentFail')); }
}

async function submitSeason(){
  if(!me){ toast(t('needAuth')); return; }
  if(!season || season.week<SEASON_WEEKS.length){ toast(t('snNotDone')); return; }
  try{
    const r=await cloud.submitScore({mode:'season', ref:'season', grids:season.grids});
    toast(r.improved ? t('sentBetter')(r.score) : t('sentWorse')(r.best));
  }catch(_){ toast(t('sentFail')); }
}

/* --- écran classements --- */
function boardTabs(){
  const tabs=LEVELS.map(L=>({ref:L.id, lab:X(L.n)}));
  tabs.push({ref:'season', lab:t('bdSeason')});
  if(rnd && rnd.seed) tabs.push({ref:`${rnd.seed}:${rnd.diff}`, lab:`${t('bdSeed')} ${rnd.seed}`});
  return tabs;
}
async function renderBoard(){
  $('#bd-title').textContent=t('bdTitle');
  $('#bd-sub').textContent=t('bdSub');
  $('#bd-h3').textContent=t('bdH3');
  const tabs=boardTabs();
  if(!tabs.some(x=>x.ref===boardRef)) boardRef=tabs[0].ref;
  const tw=$('#bd-tabs'); tw.innerHTML='';
  tabs.forEach(x=>{
    const b=document.createElement('button');
    b.type='button'; b.textContent=x.lab;
    b.setAttribute('aria-pressed',String(x.ref===boardRef));
    b.onclick=()=>{ boardRef=x.ref; renderBoard(); };
    tw.appendChild(b);
  });
  renderHistory();          // indépendant du classement, ne doit pas dépendre de ses sorties
  const ul=$('#bd-list');
  ul.innerHTML=`<li><span class="dot" style="background:var(--muted)"></span><span class="txt">…</span></li>`;
  const kind = boardRef==='season' ? 'season' : (boardRef.includes(':') ? 'seed' : 'level');
  let rows=[];
  try{ rows=await cloud.leaderboard(kind, boardRef, 25); }catch(_){ rows=[]; }
  ul.innerHTML='';
  if(!rows.length){
    ul.innerHTML=`<li><span class="dot" style="background:var(--muted)"></span><span class="txt">${t('bdEmpty')}</span></li>`;
    return;
  }
  rows.forEach((r,i)=>{
    const li=document.createElement('li');
    li.className = r.score>=90?'clean' : r.score>=70?'couv' : 'legal';
    const mine = me && r.pseudo===me.pseudo;
    const extra = kind==='season'
      ? `${t('kTreso')} ${cur(r.treasury||0)}`
      : `${t('lblCost')} ${cur(r.payroll||0)}`;
    li.innerHTML=`<span class="dot"></span><span class="txt">
        <b>${i+1}. ${r.pseudo}${mine?' <span style="color:var(--muted);font-weight:400">('+t('bdMe')+')</span>':''}</b>
        <span class="who">${extra}</span></span>
      <span class="pts" style="color:var(--ink);font-weight:600">${r.score}</span>`;
    if(kind!=='season'){                    // une saison, c'est dix grilles : pas rejouable ici
      li.style.cursor='pointer';
      li.onclick=()=>openReplay(kind,boardRef,r.pseudo,r.score);
    }
    ul.appendChild(li);
  });
}

/* Ouvre la grille d'un joueur en lecture seule. Les grilles sont
   stockées en base, c'est le meilleur outil d'apprentissage du jeu :
   voir comment le premier s'y est pris. */
async function openReplay(kind,ref,pseudo,score){
  let row=null;
  try{ row=await cloud.gridOf(kind,ref,pseudo); }catch(_){}
  if(!row||!row.grid){ toast(t('rpNone')); return; }
  let S=null;
  if(kind==='level') S=LEVELS.find(L=>L.id===ref);
  else {
    const m=/^([A-Z0-9]{1,12}):([1-5])$/.exec(ref);
    if(m) S=generateWeek(m[1],Number(m[2]));
  }
  if(!S){ toast(t('rpNone')); return; }
  scen=S; mode=(kind==='level'?'levels':'random');
  plan=applyLocks(S,Object.assign(emptyPlan(S),row.grid));
  replayInfo={pseudo,score:row.score!=null?row.score:score};
  show('play');
}

/* Historique personnel : une barre par tentative, la plus récente en haut. */
async function renderHistory(){
  $('#bd-histttl').textContent=t('histTtl');
  const ul=$('#bd-hist');
  if(!me){
    ul.innerHTML=`<li><span class="hd2"></span><span class="hl">${t('histGuest')}</span><span class="hs"></span></li>`;
    return;
  }
  ul.innerHTML=`<li><span class="hd2"></span><span class="hl">…</span><span class="hs"></span></li>`;
  let rows=[];
  try{ rows=await cloud.history(40); }catch(_){}
  if(!rows.length){
    ul.innerHTML=`<li><span class="hd2"></span><span class="hl">${t('histEmpty')}</span><span class="hs"></span></li>`;
    return;
  }
  const nom=r=>{
    if(r.mode==='season') return t('bdSeason');
    if(r.mode==='level'){ const L=LEVELS.find(l=>l.id===r.ref); return L?X(L.n):r.ref; }
    return r.ref.replace(':',' · ');
  };
  ul.innerHTML='';
  rows.forEach(r=>{
    const li=document.createElement('li');
    const d=new Date(r.created_at).toLocaleDateString(lang==='en'?'en-GB':'fr-FR',
      {day:'2-digit',month:'2-digit'});
    const col=r.score>=90?'var(--ok)':r.score>=70?'var(--warn)':'var(--bad)';
    li.innerHTML=`<span class="hd2">${d}</span>
      <span style="display:grid;gap:3px;min-width:0">
        <span class="hl">${nom(r)}</span>
        <span class="hbar"><i style="width:${r.score}%;background:${col}"></i></span>
      </span>
      <span class="hs">${r.score}</span>`;
    ul.appendChild(li);
  });
}

['#accountbtn','#accountbtn2'].forEach(sel=>{ const el=$(sel); if(el) el.onclick=openAuth; });

/* ---------- démarrage ---------- */
window.__pm={show,startScenario,setCell,LEVELS,generateWeek,newSeason,
  get season(){return season;}, set season(v){season=v;}};

(function start(){
  let had=false;
  try{had=!!localStorage.getItem('cdf_v3');}catch(_){}
  load();
  if(!had&&/^en/i.test(navigator.language||''))lang='en';
  cloud.init().then(u=>{ me=u; refreshAccount(); if(me) pullProgress().then(()=>show(screen)); })
             .catch(()=>{});
  const u=new URLSearchParams(location.search);
  const s=u.get('seed');
  if(s){
    rnd.seed=s.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12)||rnd.seed;
    const d=parseInt(u.get('d')||'2',10);
    rnd.diff=(d>=1&&d<=5)?d:2;
    show('random');
  } else show('home');
  refreshAccount();
})();
</script>

<script>
/* Filet de sécurité. Une erreur de chargement de module ne produit
   aucun message visible : la page reste structurée mais vide, ce qui
   n'aide personne. On surveille le démarrage et on affiche la cause. */
(function(){
  var derniere = null;
  window.addEventListener('error', function(e){
    derniere = e.message || (e.error && e.error.message) || 'erreur inconnue';
  }, true);
  setTimeout(function(){
    if (window.__pm) return;
    var d = document.createElement('div');
    d.setAttribute('style',
      'position:fixed;left:0;right:0;top:0;z-index:999;padding:14px 16px;'+
      'background:#9E2B24;color:#fff;font:14px/1.5 system-ui,sans-serif');
    d.innerHTML = '<b>Le jeu n\'a pas pu démarrer.</b> ' +
      (derniere ? 'Cause : ' + derniere + '. ' : '') +
      'Essayez un rechargement forcé (Ctrl+Maj+R). Si le message persiste, ' +
      'un fichier du jeu est manquant ou périmé sur le serveur.';
    document.body.insertBefore(d, document.body.firstChild);
  }, 2500);
})();
</script>
