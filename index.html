<html lang="fr">
<head>
<meta charset="utf-8">

<meta property="og:type" content="website">

<meta property="og:description" content="Trois modes, une équipe, un budget. 11 h de repos, effectifs par service, masse salariale : saurez-vous tenir une saison entière ?">
<meta property="og:url" content="https://jeu.arthurhugard.com/">
<meta property="og:image" content="https://jeu.arthurhugard.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta property="og:locale:alternate" content="en_GB">

<meta name="twitter:description" content="Trois modes, une équipe, un budget. Saurez-vous tenir une saison entière ?">
<meta name="twitter:image" content="https://jeu.arthurhugard.com/og.png">

<link rel="canonical" href="https://jeu.arthurhugard.com/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --bg:#E9ECE8; --surface:#FDFDFC; --surface-2:#F2F4F0;
  --ink:#171C1A; --ink-2:#4A544F; --muted:#79837D;
  --line:#D2D8D0; --line-strong:#B4BDB4;
  --midi:#C06A16; --midi-soft:#F6E5D0;
  --prep:#8A6A2F; --prep-soft:#EFE7D4;
  --soir:#33527E; --soir-soft:#DBE3EF;
  --coup:#6B4A7C; --coup-soft:#E8DEEE;
  --repos:#8E9790; --repos-soft:#E6E9E4;
  --ok:#2F6B45; --ok-soft:#DCEAE0;
  --warn:#9A6206; --warn-soft:#F6E8CE;
  --bad:#A8322B; --bad-soft:#F5DEDB;
  --accent:#A8322B;
  --shadow:0 1px 2px rgba(23,28,26,.06), 0 6px 18px -10px rgba(23,28,26,.22);
  --radius:6px;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111513; --surface:#191E1C; --surface-2:#212725;
    --ink:#E7ECE7; --ink-2:#AEB8B1; --muted:#8A948D;
    --line:#2C3330; --line-strong:#3C443F;
    --midi:#E6A055; --midi-soft:#3A2A16;
    --prep:#C7A667; --prep-soft:#332C1B;
    --soir:#8DAEDC; --soir-soft:#1C263A;
    --coup:#BC9BD0; --coup-soft:#2B2234;
    --repos:#7E8882; --repos-soft:#232825;
    --ok:#7BC496; --ok-soft:#18291F;
    --warn:#E0B462; --warn-soft:#2E2413;
    --bad:#EE8B81; --bad-soft:#331B19;
    --accent:#EE8B81;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191E1C; --surface-2:#212725;
  --ink:#E7ECE7; --ink-2:#AEB8B1; --muted:#8A948D;
  --line:#2C3330; --line-strong:#3C443F;
  --midi:#E6A055; --midi-soft:#3A2A16;
  --prep:#C7A667; --prep-soft:#332C1B;
  --soir:#8DAEDC; --soir-soft:#1C263A;
  --coup:#BC9BD0; --coup-soft:#2B2234;
  --repos:#7E8882; --repos-soft:#232825;
  --ok:#7BC496; --ok-soft:#18291F;
  --warn:#E0B462; --warn-soft:#2E2413;
  --bad:#EE8B81; --bad-soft:#331B19;
  --accent:#EE8B81;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:24px 56px}
/* L'écran de jeu a droit à plus de largeur : c'est un tableau, pas de la lecture. */
.wrap.play{max-width:none}
h1,h2,h3{text-wrap:balance}

/* ---------- barre haute ---------- */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  padding-bottom:14px;border-bottom:2px solid var(--ink)}
.brandline{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin:0}
.topttl{font-family:"Fraunces",Georgia,serif;font-weight:800;font-size:20px;letter-spacing:-.01em;margin:0}
.topttl em{font-style:italic;font-weight:600;color:var(--accent)}
.grow{flex:1 1 auto;min-width:4px}
.pill{font:inherit;font-size:12px;background:var(--surface);color:var(--ink-2);
  border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.pill:hover{border-color:var(--line-strong);color:var(--ink)}

/* ---------- accueil ---------- */
.hero{padding-block:34px 26px;border-bottom:1px solid var(--line);margin-bottom:26px}
.hero .brandline{margin-bottom:10px}
.hero h1{font-family:"Fraunces",Georgia,serif;font-weight:800;
  font-size:clamp(36px,7vw,62px);line-height:.95;letter-spacing:-.025em;margin:0}
.hero h1 em{font-style:italic;font-weight:600;color:var(--accent)}
.hero p{margin:14px 0 0;color:var(--ink-2);max-width:56ch;font-size:16px}
.modes{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(232px,1fr))}
.mode{text-align:left;font:inherit;cursor:pointer;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);padding:18px;
  display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);
  transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--ink);transform:translateY(-2px)}
.mode .mk{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent)}
.mode .mt{font-family:"Fraunces",Georgia,serif;font-size:23px;font-weight:600;line-height:1.1}
.mode .md{color:var(--ink-2);font-size:13px;flex:1}
.mode .mf{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
  border-top:1px solid var(--line);padding-top:8px}

/* ---------- accueil : mise en scène ---------- */
.hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.btn.hero-go{font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:600;
  padding:14px 28px;border-radius:7px;letter-spacing:-.01em}
.btn.ghost{background:none;border-color:var(--line-strong);color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface);color:var(--ink)}

.playerbar{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 16px;margin-bottom:22px;box-shadow:var(--shadow)}
.playerbar .pb{display:grid;gap:1px}
.playerbar .pk{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.playerbar .pv{font-family:"Fraunces",Georgia,serif;font-size:20px;font-weight:600;
  line-height:1.05;font-variant-numeric:tabular-nums}
.playerbar .who{font-weight:600;font-size:15px}
.playerbar .spacer{flex:1 1 auto;min-width:4px}
.starline{display:flex;gap:2px;font-size:15px;letter-spacing:1px}
.starline i{font-style:normal;color:var(--line-strong)}
.starline i.on{color:var(--midi)}

.homecols{display:grid;gap:14px;grid-template-columns:1fr;margin-bottom:22px}
@media(min-width:820px){.homecols{grid-template-columns:1.25fr 1fr}}
.homecols>*{min-width:0}
.daily{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--midi);
  border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:9px}
.daily .dk{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--midi)}
.daily h3{font-family:"Fraunces",Georgia,serif;font-size:22px;font-weight:600;margin:0;
  padding:0;border:0;background:none;text-transform:none;letter-spacing:-.01em;color:var(--ink)}
.daily p{margin:0;color:var(--ink-2);font-size:13px}
.daily .dmeta{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
  display:flex;flex-wrap:wrap;gap:4px 16px}
.daily .dgo{margin-top:4px;align-self:flex-start}

.mini-board{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden}
.mini-board h3{margin:0;padding:11px 14px;font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--line);background:var(--surface-2);font-weight:500}
.mini-board ol{list-style:none;margin:0;padding:0}
.mini-board li{display:flex;gap:10px;align-items:baseline;padding:9px 14px;
  border-bottom:1px solid var(--line);font-size:13px}
.mini-board li:last-child{border-bottom:none}
.mini-board .rk{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);width:14px}
.mini-board .nm2{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-board .sc{font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums}
.mini-board .empty{color:var(--muted);font-size:12.5px}

/* Les classements ne sont pas un mode de jeu : bande pleine largeur,
   en négatif, pour qu'on ne la confonde pas avec les trois autres. */
.boardband{width:100%;text-align:left;font:inherit;cursor:pointer;margin-top:14px;
  background:var(--ink);color:var(--surface);border:1px solid var(--ink);
  border-radius:var(--radius);padding:16px 20px;display:flex;flex-wrap:wrap;
  gap:12px 24px;align-items:center;box-shadow:var(--shadow);
  transition:transform .15s,box-shadow .15s}
.boardband:hover{transform:translateY(-2px);box-shadow:0 10px 26px -14px rgba(0,0,0,.55)}
.boardband .bk{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;opacity:.6;display:block;margin-bottom:3px}
.boardband .bt{font-family:"Fraunces",Georgia,serif;font-size:24px;font-weight:600;
  line-height:1.05;letter-spacing:-.01em;display:block}
.boardband .bd{flex:1 1 280px;font-size:13px;opacity:.78;line-height:1.45}
.boardband .barrow{font-family:"Fraunces",Georgia,serif;font-size:26px;flex:none;opacity:.7}
.boardband .bchips{display:flex;gap:6px;flex-wrap:wrap}
.boardband .bchip{font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:3px 9px;opacity:.85}

/* entrée : une seule fois, au chargement */
/* L'état au repos est VISIBLE : l'animation ne fait que retarder l'entrée.
   Avec `backwards`, si elle ne se déclenche pas, le contenu s'affiche
   normalement au lieu de rester bloqué à opacity:0. */
.anim-in{animation:riseIn .5s ease backwards}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .anim-in{opacity:1;transform:none;animation:none}
}

/* ---------- tutoriel ---------- */
.tutobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:31;margin-top:16px;
  background:var(--ink);color:var(--surface);border-radius:var(--radius);
  padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;
  box-shadow:var(--shadow)}
.tutobar .tk{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;opacity:.65;flex:none}
.tutobar .tt{flex:1 1 260px;font-size:14px;line-height:1.45}
.tutobar .tt b{font-weight:600}
.tutobar .tbtn{font:inherit;font-size:13px;cursor:pointer;border-radius:5px;padding:6px 14px;
  border:1px solid rgba(255,255,255,.35);background:none;color:var(--surface)}
.tutobar .tbtn:hover{background:rgba(255,255,255,.12)}
.tutobar .tbtn.go{background:var(--surface);color:var(--ink);border-color:var(--surface);font-weight:600}
.tutobar .tbtn[disabled]{opacity:.4;cursor:default}
.tutobar .tdone{color:#7BC496;font-weight:600;font-size:13px}

/* ---------- rejeu d'une grille du classement ---------- */
.tutobar.replay{background:var(--soir);color:#fff}
.tutobar.replay .tbtn{border-color:rgba(255,255,255,.4)}
.cell.ro{cursor:default}
.cell.ro:hover{box-shadow:none}

/* ---------- historique ---------- */
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:8px 14px;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:none}
.hist .hd2{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);
  white-space:nowrap}
.hist .hbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:40px}
.hist .hbar i{display:block;height:100%;border-radius:4px}
.hist .hs{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;
  font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
.hist .hl{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}

/* ---------- sélection de niveaux ---------- */
.pagehead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:18px}
.pagehead h2{font-family:"Fraunces",Georgia,serif;font-size:27px;font-weight:600;margin:0}
.pagehead .sub{color:var(--muted);font-size:13px}
.lvlgrid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:680px){.lvlgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.lvlgrid{grid-template-columns:repeat(3,1fr)}}
.lcard{text-align:left;font:inherit;cursor:pointer;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);padding:14px;
  display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.lcard:hover{border-color:var(--line-strong)}
.lcard .lrow{display:flex;align-items:center;gap:8px}
.lcard .ln{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.lcard .lt{font-weight:600;font-size:15px}
.lcard .ld{font-size:12.5px;color:var(--muted)}
.lcard .lb{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-2);
  border-top:1px solid var(--line);padding-top:7px;margin-top:2px;
  display:flex;justify-content:space-between;gap:8px}
.stars{margin-left:auto;display:flex;gap:2px;font-size:13px;letter-spacing:1px}
.stars i{font-style:normal;color:var(--line-strong)}
.stars i.on{color:var(--midi)}
.lcard.locked{opacity:.55;cursor:not-allowed}
.lcard.locked:hover{border-color:var(--line)}

/* ---------- saison ---------- */
.seasongrid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.seasongrid{grid-template-columns:1fr 330px;align-items:start}}
.seasongrid>*{min-width:0}
.weeks{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.wk{width:40px;height:40px;border-radius:5px;border:1px solid var(--line);
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);position:relative}
.wk.done{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.wk.done.mid{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.wk.done.low{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.wk.now{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink);font-weight:600}
.roster{list-style:none;margin:0;padding:0}
.roster li{display:grid;grid-template-columns:1fr 66px 66px;gap:8px;align-items:center;
  padding:9px 14px;border-bottom:1px solid var(--line)}
.roster li:last-child{border-bottom:none}
.roster .rn{font-size:13px;font-weight:600;line-height:1.2}
.roster .rr{font-size:11px;color:var(--muted)}
.roster .gauge{display:grid;gap:3px}
.roster .gauge span{font-family:"IBM Plex Mono",monospace;font-size:9px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gbar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:3px}
.roster li.out{opacity:.5}
.roster li.out .rn::after{content:" · arrêt";color:var(--bad);font-weight:400;font-size:11px}

/* ---------- aléatoire ---------- */
.randbox{display:grid;gap:16px;max-width:620px}
.field{display:grid;gap:6px}
.field label{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.field input[type=text],.field input[type=password],.field input[type=email]{
  font:inherit;font-family:"IBM Plex Mono",monospace;padding:9px 11px;
  border:1px solid var(--line-strong);border-radius:5px;background:var(--surface);color:var(--ink);width:100%}
.field input[type=range]{accent-color:var(--accent)}
.diffrow{display:flex;gap:6px;flex-wrap:wrap}
.diffrow button{font:inherit;font-size:13px;cursor:pointer;padding:7px 13px;border-radius:5px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.diffrow button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* ---------- brief ---------- */
.brief{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--radius);padding:14px 16px;display:grid;gap:10px;box-shadow:var(--shadow)}
.brief h2{font-family:"Fraunces",Georgia,serif;font-size:19px;margin:0;font-weight:600}
.brief p{margin:0;color:var(--ink-2);max-width:72ch}
.briefstats{display:flex;flex-wrap:wrap;gap:8px 20px;font-family:"IBM Plex Mono",monospace;
  font-size:12px;font-variant-numeric:tabular-nums}
.briefstats b{font-weight:600;color:var(--ink)}
.briefstats span{color:var(--muted)}

/* ---------- barre d'outils ---------- */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin-top:16px;padding:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:var(--shadow)}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;cursor:pointer;border-radius:5px;padding:5px 10px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink-2);display:flex;align-items:center;gap:7px;line-height:1.2}
.chip .key{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);
  border:1px solid var(--line-strong);border-radius:3px;padding:0 3px}
.chip .sw{width:10px;height:10px;border-radius:2px;flex:none}
.chip .hh{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.chip:hover{border-color:var(--line-strong)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip[aria-pressed="true"] .hh,.chip[aria-pressed="true"] .key{color:var(--surface);opacity:.75;border-color:currentColor}
.btn{font:inherit;cursor:pointer;border-radius:5px;padding:6px 14px;
  border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink)}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
.btn.primary:hover{opacity:.88}
.btn.big{padding:10px 20px;font-size:15px}

/* ---------- grille ---------- */
.gridwrap{margin-top:14px;overflow-x:auto;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
/* La grille se compresse au lieu de déborder : plus de défilement horizontal.
   Les colonnes n'ont pas de largeur plancher, ce sont les contenus qui s'allègent
   par paliers (nom du service, puis rôle, puis heures). */
.grid{display:grid;grid-template-columns:minmax(96px,1.4fr) repeat(7,minmax(0,1fr)) minmax(78px,1fr)}
.grid>*{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px 6px;
  min-height:44px;min-width:0;overflow:hidden}
.grid .nm,.grid .rl,.grid .code,.grid .hrs,.grid .sub,.grid .big,.grid .dn,.grid .ln b{
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid>.r-end{border-right:none}
.hd{background:var(--surface-2);font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;z-index:5;
  border-bottom:1px solid var(--line-strong);display:flex;flex-direction:column;justify-content:center;gap:1px}
.hd .dn{color:var(--ink);font-size:12px;letter-spacing:.04em}
.hd.closed .dn{color:var(--muted);text-decoration:line-through}
.namecell{position:sticky;left:0;z-index:4;background:var(--surface);
  display:flex;flex-direction:column;justify-content:center;gap:1px}
.hd.namecell{z-index:6;background:var(--surface-2)}
.namecell .nm{font-weight:600;font-size:13px;line-height:1.25}
.namecell .rl{font-size:11px;color:var(--muted)}
.namecell .rl .pole{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;border:1px solid var(--line-strong);border-radius:3px;padding:0 3px;margin-right:4px}
.namecell.cuisine{box-shadow:inset 3px 0 0 var(--midi)}
.namecell.salle{box-shadow:inset 3px 0 0 var(--soir)}
.cell{cursor:pointer;position:relative;display:flex;flex-direction:column;justify-content:center;
  gap:1px;user-select:none;-webkit-user-select:none;transition:box-shadow .1s}
.cell .code{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:11.5px;letter-spacing:.02em}
.cell .hrs{font-family:"IBM Plex Mono",monospace;font-size:10px;opacity:.72}
.cell:hover{box-shadow:inset 0 0 0 2px var(--line-strong)}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cell.s-R{background:var(--repos-soft);color:var(--repos)}
.cell.s-P{background:var(--prep-soft);color:var(--prep)}
.cell.s-M{background:var(--midi-soft);color:var(--midi)}
.cell.s-S{background:var(--soir-soft);color:var(--soir)}
.cell.s-C{background:var(--coup-soft);color:var(--coup)}
.cell.locked{cursor:not-allowed;color:var(--muted);
  background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 5px,var(--line) 5px,var(--line) 6px)}
.cell.locked:hover{box-shadow:none}
.cell.closedday{opacity:.45}
.cell.flagged{box-shadow:inset 0 0 0 2px var(--bad)}
.cell.flagged::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;
  border-radius:50%;background:var(--bad)}
.totcell{display:flex;flex-direction:column;justify-content:center;gap:1px;
  font-family:"IBM Plex Mono",monospace;background:var(--surface-2);font-variant-numeric:tabular-nums}
.totcell .big{font-size:14px;font-weight:600}
.totcell .sub{font-size:10px;color:var(--muted)}
.totcell.over .big{color:var(--warn)}
.totcell.way .big{color:var(--bad)}
.totcell.under .big{color:var(--soir)}
.covrow{background:var(--surface-2)}
.covlabel{position:sticky;left:0;z-index:4;background:var(--surface-2);
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);display:flex;align-items:center}
.covcell{display:flex;flex-direction:column;justify-content:center;gap:2px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-variant-numeric:tabular-nums}
.covcell .ln{display:flex;justify-content:space-between;gap:6px}
.covcell .ln b{font-weight:600}
.covcell .pl{color:var(--muted);flex:none}
.covcell .short b{color:var(--bad)}
.covcell .okk b{color:var(--ok)}
.covcell .plus b{color:var(--warn)}
.covcell.none{color:var(--muted)}

/* ---------- panneaux ---------- */
.cols{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
.cols>*{min-width:0}
/* Le panneau ne passe à côté de la grille que lorsqu'il reste assez de largeur
   pour les neuf colonnes ; en dessous il repasse dessous. */
@media(min-width:1280px){.cols{grid-template-columns:minmax(0,1fr) 300px;align-items:start}}

/* Paliers d'allègement */
@media(max-width:1180px){
  .grid>*{padding:6px 5px}
  .cell .code{font-size:11px}
}
@media(max-width:820px){
  .cell .lbl{display:none}
  .namecell .rl{font-size:10px}
  .grid{grid-template-columns:minmax(84px,1.3fr) repeat(7,minmax(0,1fr)) minmax(56px,.75fr)}
}
@media(max-width:640px){
  .grid>*{padding:5px 3px;min-height:40px}
  .namecell .rl .pole{display:none}
  .namecell .nm{font-size:12px}
  .namecell .rl{display:none}
  .covcell .pll{display:none}
  .totcell .sub{font-size:9px}
  .grid{grid-template-columns:minmax(72px,1.15fr) repeat(7,minmax(0,1fr)) minmax(50px,.7fr)}
}
@media(max-width:560px){
  .cell .hrs{display:none}
  .totcell .sub{display:none}
  .totcell .big{font-size:12px}
  .hd .dn{font-size:11px}
  .hd span:not(.dn){display:none}
  .covcell{font-size:10px}
  .grid{grid-template-columns:minmax(64px,1fr) repeat(7,minmax(0,1fr)) minmax(44px,.62fr)}
}
.covcell .pls{display:none}
@media(max-width:640px){.covcell .pls{display:inline}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden}
.panel h3{margin:0;padding:11px 14px;font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);

.scorebox{padding:14px;display:grid;gap:12px}
.scoreline{display:flex;align-items:baseline;gap:10px}
.scorenum{font-family:"Fraunces",Georgia,serif;font-weight:800;font-size:46px;line-height:.9;
  font-variant-numeric:tabular-nums}
.scoreof{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.rank{margin-left:auto;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}

.meter{display:grid;gap:4px}
.meter .mtop{display:flex;justify-content:space-between;gap:8px;

.meter .mtop span{color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .3s ease}
.issues{list-style:none;margin:0;padding:0}
.issues li{display:flex;gap:9px;padding:9px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.issues li:last-child{border-bottom:none}
.issues .dot{width:7px;height:7px;border-radius:50%;flex:none;margin-top:6px}
.issues .txt{flex:1;font-size:12.5px;line-height:1.45}
.issues .txt b{font-weight:600}
.issues .who{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.issues .pts{font-family:"IBM Plex Mono",monospace;font-size:11px;flex:none}
.issues li.legal .dot{background:var(--bad)} .issues li.legal .pts{color:var(--bad)}
.issues li.couv .dot{background:var(--warn)} .issues li.couv .pts{color:var(--warn)}
.issues li.eco .dot{background:var(--soir)} .issues li.eco .pts{color:var(--soir)}
.issues li.conf .dot{background:var(--coup)} .issues li.conf .pts{color:var(--coup)}
.issues li.clean{color:var(--ok)}
.issues li.clean .dot{background:var(--ok)}
.rules{padding:0 14px 14px}
.rules summary{cursor:pointer;padding:11px 0;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.rules summary:hover{color:var(--ink)}
.rules ul{margin:0 0 10px;padding-left:18px;color:var(--ink-2);font-size:12.5px;display:grid;gap:5px}
.rules code{font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:3px;padding:0 4px}
.disclaim{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px;margin:0}

/* ---------- débrief ---------- */
.ovl{position:fixed;inset:0;z-index:70;background:rgba(10,14,12,.62);
  display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.sheet{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.5);max-width:620px;width:100%;
  max-height:calc(100vh - 32px);overflow-y:auto}
.sheet header{padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.sheet header .ek{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.sheet header h2{font-family:"Fraunces",Georgia,serif;font-size:27px;font-weight:600;margin:0}
.sheet .body{padding:16px 22px 20px;display:grid;gap:14px}
.deltas{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.deltas li{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45}
.deltas .tag{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 6px;border-radius:3px;flex:none;margin-top:1px}
.deltas .tag.good{background:var(--ok-soft);color:var(--ok)}
.deltas .tag.bad{background:var(--bad-soft);color:var(--bad)}
.deltas .tag.warn{background:var(--warn-soft);color:var(--warn)}
.deltas .tag.info{background:var(--surface-2);color:var(--ink-2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:5px;padding:10px 12px;background:var(--surface-2)}
.kpi .kl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.kpi .kv{font-family:"Fraunces",Georgia,serif;font-size:24px;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .kv.g{color:var(--ok)} .kpi .kv.b{color:var(--bad)}
.sheet footer{padding:0 22px 20px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);
  padding:10px 18px;border-radius:999px;font-size:13px;z-index:80;box-shadow:var(--shadow);
  max-width:min(90vw,520px);text-align:center}
.hint{font-size:12px;color:var(--muted);margin:10px 2px 0}
kbd{font-family:"IBM Plex Mono",monospace;font-size:11px;border:1px solid var(--line-strong);
  border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--surface-2);color:var(--ink-2)}
footer.foot{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;font-size:12px;color:var(--muted)}
footer.foot a{color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

<!-- ===== barre haute (masquée sur l'accueil) ===== -->

let lang = "fr";
const t = k => T[lang][k];
const X = o => (o && typeof o==='object' && o.fr!==undefined) ? o[lang] : o;

/* ======================= moteur ======================= */
// Le moteur vit dans game-core.js : même code pour la page et pour
// l'Edge Function qui revalide les scores. Voir supabase/functions/.

/* --- formatage : dépend de la langue, donc ici et pas dans le moteur --- */
function fmtH(h){
  const hh=Math.floor(h+1e-9), mm=Math.round((h-hh)*60);
  if(lang==='en') return mm?`${hh}h${String(mm).padStart(2,'0')}`:`${hh}h`;
  return mm?`${hh} h ${String(mm).padStart(2,'0')}`:`${hh} h`;
}
const nf = n => Math.round(n).toLocaleString(lang==='en'?'en-GB':'fr-FR');
const cur = v => lang==='en' ? `€${nf(v)}` : `${nf(v)} €`;

/* --- traduction des codes renvoyés par le moteur --- */
function fmtIssue(i){
  const a=i.a, D=t('days'), Ds=t('daysShort'), SV=t('services');
  switch(i.code){
    case 'REST':   return [t('iRest')(fmtH(a.h),Ds[a.d1],Ds[a.d2]), t('iRestWho')(a.nom)];
    case 'OFF':    return [t('iOff'), t('iOffWho')(a.nom,a.repos)];
    case 'CONSEC': return [t('iConsec'), t('iConsecWho')(a.nom)];
    case 'MAX48':  return [t('i48')(fmtH(a.h)), t('i48Who')(a.nom)];
    case 'PAID':   return [t('iPaid')(fmtH(a.perdu)), t('iPaidWho')(a.nom,a.contrat,fmtH(a.h))];
    case 'COVER':  return [t('iCover')(D[a.jour],SV[a.sv],a.manque,a.pole),
                           t('iCoverWho')(a.present,a.need,a.pole)];
    case 'LEAD':   return [t('iResp')(D[a.jour],SV[a.sv],a.pole), t('iRespWho')(a.pole)];
    case 'WISH':   return [t('iWish'), X(a.txt)];
    case 'BUDGET': return [t('iBudget')(nf(a.over)), t('iBudgetWho')(nf(a.total),nf(a.budget))];
    default:       return [i.code, ''];
  }
}
function fmtDelta(d){
  const a=d.a||{};
  switch(d.code){
    case 'TRESO':     return t('dTreso')(nf(a.gain));
    case 'ARRET':     return t('dArret')(a.nom);
    case 'FATIGUE':   return t('dFatigue')(a.nom);
    case 'QUIT':      return t('dQuit')(a.nom);
    case 'MORAL':     return t('dMoral')(a.nom);
    case 'HS_WARN':   return t('dHSwarn')(a.nom);
    case 'HS':        return t('dHS')(a.nom,fmtH(a.h));
    case 'GOOD_REST': return t('dGoodRest');
    case 'WISHES':    return t('dWishes');
    default:          return d.code;
  }
}
// Titre et brief d'une semaine générée : construits ici, pas dans le moteur.
function randomLabels(S){
  const d=t('diffs')[S.diff-1];
  // Vérifié au solveur : jusqu'à « Tendue » une solution à 100 existe
  // toujours. Au-delà, les contrats sont volontairement trop courts pour
  // la charge, et certaines semaines plafonnent sous 100.
  const garanti = S.diff<=3;
  const base = lang==='en'
    ? `Generated week, difficulty "${d}". ${S.openDays} days open, ${S.equipe.length} staff.`
    : `Semaine générée, difficulté « ${d} ». ${S.openDays} jours ouverts, ${S.equipe.length} salariés.`;
  const suite = lang==='en'
    ? (garanti ? ' A 100/100 solution exists, the seed guarantees it.'
               : ' At this level a perfect score is not guaranteed: the contracts are deliberately too short for the workload.')
    : (garanti ? ' Une solution à 100/100 existe, la graine le garantit.'
               : ' À ce niveau le 100 n\'est pas garanti : les contrats sont volontairement trop courts pour la charge.');
  return { titre:d, brief: base+suite };
}

/* ======================= état ======================= */
let screen='home', mode=null, scen=null, plan=null, brush='C', painting=false;
let progress={}, season=null, rnd={seed:randomSeed(),diff:2};

function emptyPlan(S){const p={};S.equipe.forEach(em=>{p[em.id]=[0,0,0,0,0,0,0].map(()=> 'R');});return p;}
function applyLocks(S,p){
  S.equipe.forEach(em=>{if(em.indispo)Object.keys(em.indispo).forEach(d=>{p[em.id][+d]='R';});});
  S.jours.forEach((j,d)=>{if(j.ferme)S.equipe.forEach(em=>{p[em.id][d]='R';});});
  return p;
}
function isLocked(S,em,d){return (em.indispo&&em.indispo[d]!==undefined)||S.jours[d].ferme;}

function save(){
  try{ localStorage.setItem('cdf_v3',JSON.stringify({lang,progress,season,rnd})); }catch(_){}
}
function load(){
  try{
    const raw=localStorage.getItem('cdf_v3'); if(!raw)return;
    const d=JSON.parse(raw);
    if(d.lang&&T[d.lang])lang=d.lang;
    if(d.progress)progress=d.progress;
    if(d.season)season=d.season;
    if(d.rnd)rnd=d.rnd;
  }catch(_){}
}
const stars = s => s>=100?3 : s>=80?2 : s>=60?1 : 0;

/* ======================= rendu ======================= */
const $=s=>document.querySelector(s);
const SCREENS=['home','levels','season','random','board','play'];
function show(name){
  screen=name;
  SCREENS.forEach(s=>{ $('#scr-'+s).hidden = (s!==name); });
  $('#topbar').hidden = (name==='home');
  document.querySelector('.wrap').classList.toggle('play',name==='play');
  window.scrollTo(0,0);
  renderChrome();
  if(name==='home')   renderHome();
  if(name==='levels') renderLevels();
  if(name==='season') renderSeason();
  if(name==='random') renderRandom();
  if(name==='board')  renderBoard();
  if(name==='play')   renderPlay();
}

function renderChrome(){
  document.documentElement.setAttribute('lang',t('html'));
  ['#langbtn','#langbtn2'].forEach(s=>{const el=$(s);if(el)el.textContent=t('other');});
  ['#themebtn','#themebtn2'].forEach(s=>{const el=$(s);if(el)el.textContent=t('theme');});
  $('#btnHome').textContent=t('menu');
  refreshAccount();
}

function totalStars(){
  return LEVELS.reduce((a,L)=>a+stars(progress[L.id]||0),0);
}
function heroAction(){
  const joue = LEVELS.some(L=>progress[L.id]);
  if(!progress.tuto && !joue) return {key:'tuto', label:t('ctaTuto')};
  if(season && season.week>0 && season.week<SEASON_WEEKS.length)
    return {key:'season', label:t('ctaSeason')(season.week+1)};
  const next = LEVELS.find(L=>(progress[L.id]||0)<100) || LEVELS[0];
  return {key:'level', level:next, label:t('ctaResume')(X(next.n))};
}

  $('#h-tag').textContent=t('tag');

  const act=heroAction();

  go.textContent=act.label;
  go.onclick=()=>{
    if(act.key==='tuto'){ startTutorial(); }

  };
  const alt=$('#h-alt');

  // bandeau joueur
  const st=totalStars(), max=LEVELS.length*3;

  const done=LEVELS.filter(L=>(progress[L.id]||0)>=60).length;

  if(me){
    pb.innerHTML=`
      <span class="who">${me.pseudo||me.email}</span>

        <span class="starline">${Array.from({length:max},(_,k)=>

      <div class="pb"><span class="pk">${t('pbBest')}</span><span class="pv">${best||'·'}</span></div>
      <div class="pb"><span class="pk">${t('pbRank')}</span><span class="pv">${done}<span style="font-size:13px;color:var(--muted)">/${LEVELS.length}</span></span></div>`;
  } else {
    pb.innerHTML=`
      <div class="pb"><span class="pk">${t('pbStars')}</span>

      <button class="btn" id="pb-in" type="button">${t('pbGuestGo')}</button>`;
    const b=$('#pb-in'); if(b) b.onclick=openAuth;

  // défi du jour

    <h3>${jour.charAt(0).toUpperCase()+jour.slice(1)}</h3>

    <div class="dmeta"><span>${t('dSeed')(seed)}</span><span>${t('dDiff')}</span>

  $('#h-dgo').onclick=()=>{ startScenario(dailyScenario(),'daily'); };

  $('#h-topttl').textContent=t('topTtl');

function renderLevels(){
  $('#lv-title').textContent=t('lvTitle');
  $('#lv-sub').textContent=t('lvSub');
  const w=$('#lvlgrid'); w.innerHTML='';
  LEVELS.forEach((L,i)=>{
    const best=progress[L.id]||0;
    const prev=i===0?null:LEVELS[i-1];
    const locked=prev? (progress[prev.id]||0)<60 : false;
    const btn=document.createElement('button');
    btn.className='lcard'+(locked?' locked':''); btn.type='button';
    const st=stars(best);
    btn.innerHTML=`
      <div class="lrow"><span class="ln">${X(L.n)}</span>
        <span class="stars">${[0,1,2].map(k=>`<i class="${k<st?'on':''}">★</i>`).join('')}</span></div>
      <span class="lt">${X(L.titre)}</span>
      <span class="ld">${X(L.sous)}</span>
      <span class="lb"><span>${locked?t('lvLocked'):(best?t('lvBest')+' '+best+'/100':t('lvNever'))}</span>
        <span>${cur(L.budget)}</span></span>`;
    if(!locked) btn.onclick=()=>{startScenario(L,'levels');};
    w.appendChild(btn);
  });
}

function renderSeason(){
  if(!season) season=newSeason();
  $('#sn-title').textContent=t('snTitle');
  $('#sn-sub').textContent=t('snSub');
  $('#sn-logttl').textContent=t('snLogTtl');
  $('#sn-kpittl').textContent=t('snKpiTtl');
  $('#sn-teamttl').textContent=t('snTeamTtl');
  $('#sn-reset').textContent=t('snReset');

  const done=season.week>=SEASON_WEEKS.length;
  const wk=$('#sn-weeks'); wk.innerHTML='';
  SEASON_WEEKS.forEach((W,i)=>{
    const d=document.createElement('div');
    const rec=season.log.find(l=>l.week===i);
    let cls='wk';
    if(rec) cls+=' done'+(rec.score>=80?'':rec.score>=55?' mid':' low');
    if(i===season.week&&!done) cls+=' now';
    d.className=cls; d.textContent=i+1;
    d.title=X(W.nom);
    wk.appendChild(d);
  });

  if(done){
    $('#sn-wtitle').textContent=t('snDone');
    $('#sn-wtext').textContent=t('snDoneSub');
    $('#sn-wstats').innerHTML='';
    $('#sn-play').hidden=false;
    $('#sn-play').dataset.act='submit';
    $('#sn-play').textContent=t('snSubmit');
  }else{
    const S=seasonScenario(season);
    $('#sn-wtitle').textContent=`${X(S.n)} · ${X(S.titre)}`;
    $('#sn-wtext').textContent=X(S.brief);
    const hTot=S.equipe.reduce((s,x)=>s+x.contrat,0);
    $('#sn-wstats').innerHTML=
      `<span>${t('statTeam')} <b>${S.equipe.filter(x=>!x.indispo||Object.keys(x.indispo).length<7).length}</b></span>
       <span>${t('statHours')} <b>${hTot} h</b></span>
       <span>${t('statCA')} <b>${cur(S.ca)}</b></span>
       <span>${t('statBudget')} <b>${cur(S.budget)}</b></span>`;
    $('#sn-play').hidden=false;
    $('#sn-play').dataset.act='play';
    $('#sn-play').textContent=t('snPlay')(season.week+1);
  }

  const avg=season.scores.length?Math.round(season.scores.reduce((a,c)=>a+c,0)/season.scores.length):0;
  const hsTot=season.roster.filter(r=>!r.parti).reduce((s,r)=>s+r.compteurHS,0);
  $('#sn-kpis').innerHTML=`
    <div class="kpi"><div class="kl">${t('kWeek')}</div><div class="kv">${Math.min(season.week+1,10)}<span style="font-size:14px;color:var(--muted)">/10</span></div></div>
    <div class="kpi"><div class="kl">${t('kTreso')}</div><div class="kv ${season.tresorerie>=0?'g':'b'}">${cur(season.tresorerie)}</div></div>
    <div class="kpi"><div class="kl">${t('kScore')}</div><div class="kv">${avg||'·'}</div></div>
    <div class="kpi"><div class="kl">${t('kHS')}</div><div class="kv">${fmtH(hsTot)}</div></div>`;

  const ul=$('#sn-roster'); ul.innerHTML='';
  season.roster.filter(r=>!r.parti).forEach(r=>{
    const li=document.createElement('li');
    if(r.arret) li.className='out';
    const fc=r.fatigue>=70?'var(--bad)':r.fatigue>=45?'var(--warn)':'var(--ok)';
    const mc=r.moral<=30?'var(--bad)':r.moral<=55?'var(--warn)':'var(--ok)';
    li.innerHTML=`
      <div><div class="rn">${r.nom}</div><div class="rr">${t('roles')[r.role]} · ${r.contrat} h</div></div>
      <div class="gauge"><span>${t('gFatigue')}</span><div class="gbar"><i style="width:${r.fatigue}%;background:${fc}"></i></div></div>
      <div class="gauge"><span>${t('gMoral')}</span><div class="gbar"><i style="width:${r.moral}%;background:${mc}"></i></div></div>`;
    ul.appendChild(li);
  });

  const lg=$('#sn-log'); lg.innerHTML='';
  if(!season.log.length){
    lg.innerHTML=`<li><span class="dot" style="background:var(--muted)"></span><span class="txt">${t('snEmptyLog')}</span></li>`;
  }else{
    season.log.slice().reverse().forEach(l=>{
      const li=document.createElement('li');
      li.className=l.score>=80?'clean':l.score>=55?'couv':'legal';
      li.innerHTML=`<span class="dot"></span><span class="txt"><b>${X(SEASON_WEEKS[l.week].nom)}</b>
        <span class="who">${l.score}/100 · ${l.gain>=0?'+':''}${cur(l.gain)}</span></span>`;
      lg.appendChild(li);
    });
  }
}

/* ---------- écran de jeu ---------- */
function startScenario(S,from){
  replayInfo=null;
  scen=S; mode=from;
  plan=applyLocks(S,emptyPlan(S));
  if(from==='season'&&season&&season.plan) plan=season.plan;
  show('play');
}
function renderPlay(){
  const S=scen, ev=evaluate(S,plan);
  $('#btnClear').textContent=t('btnClear');
  $('#btnDraft').textContent=t('btnDraft');
  $('#btnDraft').hidden=!S.draft||!!replayInfo;
  document.querySelector('.toolbar').style.display=replayInfo?'none':'';
  $('#btnCheck').textContent=t('btnCheck');
  $('#btnShare').textContent=t('btnShare');
  $('#hint').innerHTML=t('hint');
  $('#h3board').textContent=t('h3board');
  $('#h3live').textContent=t('h3live');
  $('#h3rules').textContent=t('h3rules');
  $('#lblCost').textContent=t('lblCost');
  $('#lblCov').textContent=t('lblCov');
  $('#sumLegal').textContent=t('sumLegal');
  $('#sumHouse').textContent=t('sumHouse');
  $('#ulLegal').innerHTML=t('ulLegal').map(x=>`<li>${x}</li>`).join('');
  $('#ulHouse').innerHTML=t('ulHouse').map(x=>`<li>${x}</li>`).join('');
  $('#disclaim').textContent=t('disclaim');
  const lab = S.diff ? randomLabels(S) : {titre:X(S.titre), brief:X(S.brief)};
  $('#briefTitle').textContent=`${X(S.n)} · ${lab.titre}`;
  $('#briefText').textContent=lab.brief;
  const hTot=S.equipe.reduce((s,x)=>s+x.contrat,0);

    `<span>${t('statTeam')} <b>${S.equipe.length}</b></span>
     <span>${t('statHours')} <b>${hTot} h</b></span>
     <span>${t('statCA')} <b>${cur(S.ca)}</b></span>
     <span>${t('statBudget')} <b>${cur(S.budget)}</b> (${Math.round(S.budget/S.ca*100)} %)</span>`;
  renderPalette(); renderGrid(S,plan,ev); renderPanel(S,ev); renderTutobar(ev);
}
function renderPalette(){
  const w=$('#palette'); w.innerHTML='';
  ORDER.forEach(code=>{
    const s=SHIFTS[code];
    const btn=document.createElement('button');
    btn.className='chip'; btn.type='button';
    btn.setAttribute('aria-pressed',String(code===brush));
    const k=Object.keys(KEYMAP).find(x=>KEYMAP[x]===code);
    btn.innerHTML=`<span class="sw" style="background:var(${s.col})"></span>${t('shifts')[code]}
      <span class="hh">${s.h?fmtH(s.h):s.label}</span><span class="key">${k}</span>`;
    btn.title=s.label;
    btn.onclick=()=>{brush=code;renderPalette();};
    w.appendChild(btn);
  });
}
function renderGrid(S,p,ev){
  const g=$('#grid'); g.innerHTML='';
  const D=t('days');
  const add=(cls,html,last)=>{const d=document.createElement('div');
    d.className=cls+(last?' r-end':'');d.innerHTML=html;g.appendChild(d);return d;};
  add('hd namecell',`<span class="dn">${t('team')}</span>`);
  S.jours.forEach((j,d)=>{
    const sub=j.note?t('notes')[j.note]
      :`${t('midiCount')(j.besoin.midi.cuisine+j.besoin.midi.salle)} · ${t('soirCount')(j.besoin.soir.cuisine+j.besoin.soir.salle)}`;
    add('hd'+(j.ferme?' closed':''),`<span class="dn">${D[d]}</span><span>${sub}</span>`);
  });
  add('hd',`<span class="dn">${t('total')}</span><span>${t('contract')}</span>`,true);
  S.equipe.forEach(em=>{
    add('namecell '+em.pole,
      `<span class="nm">${em.nom}</span><span class="rl"><span class="pole">${t('poleShort')[em.pole]}</span>${t('roles')[em.role]}${em.resp?' ·&nbsp;'+t('resp'):''}</span>`);
    S.jours.forEach((j,d)=>{
      const code=p[em.id][d], s=SHIFTS[code];
      const lock=isLocked(S,em,d);
      const motif=em.indispo&&em.indispo[d];
      const cls=['cell','s-'+code];
      if(lock)cls.push('locked');
      if(j.ferme)cls.push('closedday');
      if(ev.flags.has(em.id+'-'+d))cls.push('flagged');
      const label=lock?(motif?t('motifs')[motif]:t('motifs').ferme):t('shifts')[code];
      const sub=lock?'':(s.h?fmtH(s.h):'·');
      const c=add(cls.join(' '),
        lock
          ? `<span class="code"><span class="lbl">${label}</span></span>`
          : `<span class="code">${code}<span class="lbl"> · ${label}</span></span><span class="hrs">${sub}</span>`);
      c.title=lock?label:`${t('shifts')[code]}${s.label?' · '+s.label:''}`;
      if(replayInfo) c.classList.add('ro');
      if(!lock && !replayInfo){
        c.tabIndex=0;
        c.addEventListener('pointerdown',e2=>{e2.preventDefault();painting=true;setCell(em.id,d,brush);});
        c.addEventListener('pointerenter',()=>{if(painting)setCell(em.id,d,brush);});
        c.addEventListener('keydown',ke=>{
          if(KEYMAP[ke.key]){ke.preventDefault();setCell(em.id,d,KEYMAP[ke.key]);}
          else if(ke.key==='Enter'||ke.key===' '){ke.preventDefault();setCell(em.id,d,brush);}
        });
      }
    });
    const h=ev.hours[em.id], diff=h-em.contrat;
    let tc='totcell';
    if(diff>4)tc+=' way'; else if(diff>0.01)tc+=' over'; else if(diff<-0.01)tc+=' under';
    add(tc,`<span class="big">${fmtH(h)}</span><span class="sub">/${em.contrat}h · ${cur(ev.cost[em.id])}</span>`,true);
  });
  ['midi','soir'].forEach(sv=>{
    add('covrow covlabel',t('needFor')(t('services')[sv]));
    S.jours.forEach((j,d)=>{
      const nc=j.besoin[sv].cuisine, ns=j.besoin[sv].salle;
      if(nc+ns===0){add('covrow covcell none','<span class="ln">·</span>');return;}
      const cnt=pole=>S.equipe.filter(em=>em.pole===pole&&SHIFTS[p[em.id][d]].couvre.includes(sv)).length;
      const line=(pole,got,need)=>{
        if(need===0)return '';
        const k=got<need?'short':(got>need?'plus':'okk');
        const lg=t('poleShort')[pole], sh=lg[0];
        return `<span class="ln ${k}"><span class="pl"><span class="pll">${lg}</span><span class="pls">${sh}</span></span><b>${got}/${need}</b></span>`;
      };
      add('covrow covcell',line('cuisine',cnt('cuisine'),nc)+line('salle',cnt('salle'),ns));
    });
    add('covrow covcell none','',true);
  });
}
function renderPanel(S,ev){
  $('#score').textContent=ev.score;
  const r=$('#rank');
  if(ev.score>=90){r.className='rank g';r.textContent=t('rankGood');}
  else if(ev.score>=70){r.className='rank w';r.textContent=t('rankMid');}
  else {r.className='rank b';r.textContent=t('rankBad');}
  const pctCost=ev.total/S.budget*100;
  $('#costTxt').textContent=`${cur(ev.total)} / ${cur(S.budget)}`;
  const cb=$('#costBar');
  cb.style.width=Math.min(100,pctCost)+'%';
  cb.style.background=pctCost>100?'var(--bad)':(pctCost>92?'var(--warn)':'var(--ok)');
  const pctCov=ev.postesTot?ev.postesOK/ev.postesTot*100:100;
  $('#covTxt').textContent=`${ev.postesOK} / ${ev.postesTot}`;
  const vb=$('#covBar');
  vb.style.width=pctCov+'%';
  vb.style.background=pctCov>=100?'var(--ok)':(pctCov>=90?'var(--warn)':'var(--bad)');
  const ul=$('#issues'); ul.innerHTML='';
  if(!ev.issues.length){
    ul.innerHTML=`<li class="clean"><span class="dot"></span><span class="txt">${t('clean')}</span></li>`;
    return;
  }
  const rk={legal:0,couv:1,eco:2,conf:3};
  const sorted=ev.issues.slice().sort((a,c)=>(rk[a.cat]-rk[c.cat])||(c.pts-a.pts));
  sorted.slice(0,14).forEach(i=>{
    const li=document.createElement('li');
    li.className=i.cat;
    const [ttl,who]=fmtIssue(i);
    li.innerHTML=`<span class="dot"></span><span class="txt"><b>${ttl}</b><span class="who">${who}</span></span><span class="pts">−${i.pts}</span>`;
    ul.appendChild(li);
  });
  if(sorted.length>14){
    const li=document.createElement('li');
    li.innerHTML=`<span class="dot" style="background:var(--muted)"></span><span class="txt">${t('more')(sorted.length-14)}</span>`;
    ul.appendChild(li);
  }
}
function setCell(empId,d,code){
  if(replayInfo) return;          // grille d'un autre joueur : on ne touche pas
  const em=scen.equipe.find(x=>x.id===empId);
  if(!em||isLocked(scen,em,d)||plan[empId][d]===code)return;
  plan[empId][d]=code;
  if(mode==='season'&&season) season.plan=plan;
  save();
  renderPlay();
}

/* ---------- débrief saison ---------- */
function openDebrief(ev,deltas,weekNo){
  const ovl=document.createElement('div');
  ovl.className='ovl';
  ovl.innerHTML=`
    <div class="sheet" role="dialog" aria-modal="true">
      <header><div class="ek">${t('snTitle')}</div><h2>${t('dbWeek')(weekNo)}</h2></header>
      <div class="body">
        <div class="kpis">
          <div class="kpi"><div class="kl">Score</div><div class="kv">${ev.score}</div></div>
          <div class="kpi"><div class="kl">${t('lblCost')}</div><div class="kv" style="font-size:19px">${cur(ev.total)}</div></div>
          <div class="kpi"><div class="kl">${t('kTreso')}</div><div class="kv ${season.tresorerie>=0?'g':'b'}" style="font-size:19px">${cur(season.tresorerie)}</div></div>
        </div>
        <ul class="deltas">${deltas.map(d=>`<li><span class="tag ${d.tag}">${
          d.tag==='good'?'+':d.tag==='bad'?'!':d.tag==='warn'?'~':'i'}</span><span>${fmtDelta(d)}</span></li>`).join('')}</ul>
      </div>
      <footer><button class="btn primary" id="db-ok">${t('dbNext')}</button></footer>
    </div>`;
  document.body.appendChild(ovl);
  ovl.querySelector('#db-ok').onclick=()=>{ovl.remove();show('season');};
}

/* ---------- actions ---------- */
let toastT;
function toast(msg){
  clearTimeout(toastT);
  let el=document.querySelector('.toast');
  if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el);}
  el.textContent=msg;
  toastT=setTimeout(()=>{el.remove();},5600);
}
$('#btnHome').onclick=()=>{show('home');};
$('#btnClear').onclick=()=>{
  plan=applyLocks(scen,emptyPlan(scen));
  if(mode==='season'&&season)season.plan=plan;
  save(); renderPlay(); toast(t('tClear'));
};
$('#btnDraft').onclick=()=>{
  if(!scen.draft){toast(t('tNoDraft'));return;}
  let p=emptyPlan(scen);
  scen.equipe.forEach(em=>{if(scen.draft[em.id])p[em.id]=scen.draft[em.id].slice();});
  plan=applyLocks(scen,p);
  save(); renderPlay(); toast(t('tDraft'));
};
$('#btnCheck').onclick=()=>{
  const ev=evaluate(scen,plan);
  const legal=ev.issues.filter(i=>i.cat==='legal').length;
  const couv=ev.issues.filter(i=>i.cat==='couv').length;
  if(mode==='levels'){
    const prev=progress[scen.id]||0;
    if(ev.score>prev){progress[scen.id]=ev.score;save();}
  }
  if(mode==='daily'){
    const d=progress.daily;
    if(!d||d.seed!==scen.seed||ev.score>d.score){
      progress.daily={seed:scen.seed,score:ev.score}; save();
    }
  }
  if(mode==='tuto'){ return; }
  if(mode==='season'&&season){
    if(legal){toast(t('tLegal')(ev.score,legal));return;}
    const weekNo=season.week+1;
    const deltas=applySeasonWeek(season,scen,ev);
    save(); pushProgress();
    openDebrief(ev,deltas,weekNo);
    return;
  }
  if(!ev.issues.length)toast(t('tPerfect'));
  else if(legal)toast(t('tLegal')(ev.score,legal));
  else if(couv)toast(t('tCouv')(ev.score,couv));
  else toast(t('tOpti')(ev.score));
  if(me && !legal) setTimeout(()=>submitCurrent(ev),1200);
  pushProgress();
};
/* Bloc de partage : une ligne par salarié, une case par jour.
   Du texte, pas une image : ça se colle partout et ça garde la
   lisibilité des couleurs du jeu. */
const SQ={R:'\u2B1C',P:'\uD83D\uDFE8',M:'\uD83D\uDFE7',S:'\uD83D\uDFE6',C:'\uD83D\uDFEA'};
function shareBlock(S,p,ev){
  const lignes=S.equipe.map(em=>
    S.jours.map((j,d)=> j.ferme ? '\u2B1B' : (SQ[p[em.id][d]]||'\u2B1C')).join('')
  ).join('\n');
  const lab = scen.diff ? randomLabels(scen).titre : X(S.titre);
  const ent = `PlanningMaster · ${X(S.n)} · ${ev.score}/100`;
  return `${ent}\n${lab}\n\n${lignes}\n\n${t('shLegend')}\nhttps://${SITE}`;
}

$('#btnShare').onclick=async()=>{
  const ev=evaluate(scen,plan);
  const txt=shareBlock(scen,plan,ev);
  try{
    if(navigator.share&&/Android|iPhone|iPad/i.test(navigator.userAgent)){
      await navigator.share({title:'PlanningMaster',text:txt}); return;
    }
    await navigator.clipboard.writeText(txt); toast(t('shCopied'));
  }catch(_){
    try{
      const ta=document.createElement('textarea');
      ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove(); toast(t('shCopied'));
    }catch(__){toast(t('tCopyFail'));}
  }
};

  check:(p)=>[2,3,4].every(d=>p.c1[d]==='C'&&p.s1[d]==='C')},
 {txt:{fr:"Colonne <b>Total</b> à droite : <b>39 h sur 39 h</b>, exactement le contrat. Ni heure supplémentaire, ni heure payée dans le vide. Le score est à 100.",
       en:"<b>Total</b> column on the right: <b>39h of 39h</b>, exactly the contract. No overtime, no paid idle hours. The score is 100."},
  info:true},
 {txt:{fr:"Maintenant provoquons une infraction. Mettez <b>Soir</b> sur le mercredi de Marc, puis <b>Prépa</b> sur son jeudi.",
       en:"Now let's trigger a breach. Put <b>Dinner</b> on Marc's Wednesday, then <b>Prep</b> on his Thursday."},
  check:(p,ev)=>ev.issues.some(i=>i.code==='REST')},
 {txt:{fr:"Les deux cases passent en rouge : le soir finit à 23:45, la prépa reprend à 08:00, soit <b>8 h 15 de repos</b> au lieu des 11 h légales. Remettez deux <b>coupures</b> pour revenir à 100.",
       en:"Both cells turn red: dinner ends at 23:45, prep starts at 08:00, giving <b>8h15 of rest</b> instead of the legal 11. Put two <b>splits</b> back to return to 100."},

];
let tuStep=0;

function startTutorial(){
  tuStep=0;
  startScenario(TUTORIAL,'tuto');
}
function renderTutobar(ev){
  const bar=$('#tutobar');
  if(replayInfo){
    bar.hidden=false; bar.className='tutobar replay';
    bar.innerHTML=`<span class="tk">${t('rpTtl')(replayInfo.pseudo,replayInfo.score)}</span>
      <span class="tt">${t('rpSub')}</span>
      <button class="tbtn go" id="rp-quit" type="button">${t('rpQuit')}</button>`;
    $('#rp-quit').onclick=()=>{ replayInfo=null; show('board'); };
    return;
  }
  bar.className='tutobar';
  if(mode!=='tuto'){ bar.hidden=true; return; }
  bar.hidden=false;
  const fini = tuStep>=TU_STEPS.length;
  if(fini){
    bar.innerHTML=`<span class="tk">${t('tuDone')}</span>
      <span class="tt">${t('tuFin')}</span>
      <button class="tbtn go" id="tu-go" type="button">${t('tuGoLevel')}</button>`;
    $('#tu-go').onclick=()=>{ startScenario(LEVELS[0],'levels'); };
    return;
  }
  const st=TU_STEPS[tuStep];
  const ok = st.info ? true : st.check(plan,ev);
  bar.innerHTML=`<span class="tk">${t('tuStep')(tuStep+1,TU_STEPS.length)}</span>
    <span class="tt">${X(st.txt)}</span>
    ${ok&&st.info?`<button class="tbtn go" id="tu-next" type="button">${t('tuNext')}</button>`:''}
    ${ok&&!st.info?`<span class="tdone">✓</span>`:''}
    <button class="tbtn" id="tu-skip" type="button">${t('tuSkip')}</button>`;
  const nx=$('#tu-next'); if(nx) nx.onclick=()=>{ tuStep++; renderPlay(); };
  $('#tu-skip').onclick=()=>{ progress.tuto=100; save(); pushProgress(); show('home'); };
  // les étapes à condition s'enchaînent d'elles-mêmes
  if(ok && !st.info){
    setTimeout(()=>{
      if(mode!=='tuto') return;
      const e2=evaluate(scen,plan);
      if(TU_STEPS[tuStep] && !TU_STEPS[tuStep].info && TU_STEPS[tuStep].check(plan,e2)){
        tuStep++;
        if(tuStep>=TU_STEPS.length){ progress.tuto=100; save(); pushProgress(); }
        renderPlay();
      }
    },700);
  }
}

function refreshAccount(){

  ['#accountbtn','#accountbtn2'].forEach(sel=>{
    const el=$(sel); if(el) el.textContent=label;
  });

function openAuth(){
  if(me){ openAccount(); return; }
  let up = false;                       // false = connexion, true = inscription
  const ovl=document.createElement('div');
  ovl.className='ovl';
  const draw=()=>{
    ovl.innerHTML=`
      <div class="sheet" role="dialog" aria-modal="true" style="max-width:420px">
        <header><div class="ek">PlanningMaster</div>
          <h2>${up?t('authTtlUp'):t('authTtlIn')}</h2></header>
        <div class="body">
          <div class="field"><label for="au-mail">${t('fEmail')}</label>
            <input type="text" id="au-mail" autocomplete="email" inputmode="email"></div>
          <div class="field"><label for="au-pass">${t('fPass')}</label>
            <input type="password" id="au-pass" autocomplete="${up?'new-password':'current-password'}"></div>
          ${up?`<div class="field"><label for="au-pseudo">${t('fPseudo')}</label>
            <input type="text" id="au-pseudo" maxlength="24" autocomplete="nickname"></div>`:''}
          <p id="au-err" class="disclaim" style="color:var(--bad);border:0;padding:0" hidden></p>
          <button class="btn" id="au-swap" type="button"
            style="background:none;border:0;padding:0;color:var(--ink-2);text-align:left;text-decoration:underline">
            ${up?t('goIn'):t('goUp')}</button>
        </div>
        <footer>
          <button class="btn" id="au-cancel" type="button">${t('authCancel')}</button>
          <button class="btn primary" id="au-go" type="button">${t('authGo')}</button>
        </footer>
      </div>`;
    ovl.querySelector('#au-cancel').onclick=()=>ovl.remove();
    ovl.querySelector('#au-swap').onclick=()=>{ up=!up; draw(); };
    ovl.querySelector('#au-go').onclick=go;
    ovl.querySelectorAll('input').forEach(i=>{
      i.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
    });
  };
  const fail=(msg)=>{
    const p=ovl.querySelector('#au-err');
    p.textContent=msg; p.hidden=false;
  };
  async function go(){
    const mail=(ovl.querySelector('#au-mail').value||'').trim();
    const pass=ovl.querySelector('#au-pass').value||'';
    const pseudo=up?(ovl.querySelector('#au-pseudo').value||'').trim():'';
    if(!mail || !pass) return fail(t('authBad'));
    if(up && pass.length<6) return fail(t('authShort'));
    const btn=ovl.querySelector('#au-go'); btn.disabled=true;
    try{
      if(up){
        const r=await cloud.signUp(mail,pass,pseudo||mail.split('@')[0]);
        if(!r.confirmed){ ovl.remove(); toast(t('authMail')); return; }
      } else {
        await cloud.signIn(mail,pass);
      }
      me=cloud.currentUser();
      await pullProgress();
      ovl.remove(); refreshAccount(); renderAll();
      toast(t('authDone')(me.pseudo||me.email));
    }catch(err){
      btn.disabled=false;
      fail(String(err.message||err).includes('6') ? t('authShort') : t('authBad'));
    }
  }
  draw();
  document.body.appendChild(ovl);
  setTimeout(()=>{ const el=ovl.querySelector('#au-mail'); if(el) el.focus(); },30);
}

function openAccount(){
  const ovl=document.createElement('div');

      <header><div class="ek">${t('account')}</div><h2>${me.pseudo||me.email}</h2></header>

/* --- progression : le nuage fait autorité au moment de la connexion --- */
async function pullProgress(){
  try{
    const d=await cloud.loadProgress();
    if(d && typeof d==='object'){
      if(d.progress) progress=Object.assign({},progress,d.progress);
      if(d.season) season=d.season;
      save();
    } else {
      await cloud.saveProgress({progress,season});
    }
  }catch(_){}
}
async function pushProgress(){
  if(!me) return;
  try{ await cloud.saveProgress({progress,season}); }catch(_){}
}

/* --- envoi d'une grille pour vérification --- */
async function submitCurrent(ev){
  if(!me){ toast(t('needAuth')); return; }
  if(ev.issues.some(i=>i.cat==='legal')){ toast(t('sentLegal')); return; }
  let payload=null;
  if(mode==='levels') payload={mode:'level', ref:scen.id, grid:plan};
  else if(mode==='random'||mode==='daily') payload={mode:'seed', ref:`${scen.seed}:${scen.diff}`, grid:plan};
  else return;
  try{
    const r=await cloud.submitScore(payload);
    toast(r.improved ? t('sentBetter')(r.score) : t('sentWorse')(r.best));
  }catch(_){ toast(t('sentFail')); }
}

async function submitSeason(){
  if(!me){ toast(t('needAuth')); return; }
  if(!season || season.week<SEASON_WEEKS.length){ toast(t('snNotDone')); return; }
  try{
    const r=await cloud.submitScore({mode:'season', ref:'season', grids:season.grids});
    toast(r.improved ? t('sentBetter')(r.score) : t('sentWorse')(r.best));
  }catch(_){ toast(t('sentFail')); }
}

function boardTabs(){
  const tabs=LEVELS.map(L=>({ref:L.id, lab:X(L.n)}));
  tabs.push({ref:'season', lab:t('bdSeason')});
  if(rnd && rnd.seed) tabs.push({ref:`${rnd.seed}:${rnd.diff}`, lab:`${t('bdSeed')} ${rnd.seed}`});
  return tabs;
}
async function renderBoard(){
  $('#bd-title').textContent=t('bdTitle');
  $('#bd-sub').textContent=t('bdSub');
  $('#bd-h3').textContent=t('bdH3');
  const tabs=boardTabs();
  if(!tabs.some(x=>x.ref===boardRef)) boardRef=tabs[0].ref;
  const tw=$('#bd-tabs'); tw.innerHTML='';
  tabs.forEach(x=>{
    const b=document.createElement('button');
    b.type='button'; b.textContent=x.lab;
    b.setAttribute('aria-pressed',String(x.ref===boardRef));
    b.onclick=()=>{ boardRef=x.ref; renderBoard(); };
    tw.appendChild(b);
  });
  renderHistory();          // indépendant du classement, ne doit pas dépendre de ses sorties
  const ul=$('#bd-list');
  ul.innerHTML=`<li><span class="dot" style="background:var(--muted)"></span><span class="txt">…</span></li>`;
  const kind = boardRef==='season' ? 'season' : (boardRef.includes(':') ? 'seed' : 'level');
  let rows=[];
  try{ rows=await cloud.leaderboard(kind, boardRef, 25); }catch(_){ rows=[]; }
  ul.innerHTML='';
  if(!rows.length){
    ul.innerHTML=`<li><span class="dot" style="background:var(--muted)"></span><span class="txt">${t('bdEmpty')}</span></li>`;
    return;
  }
  rows.forEach((r,i)=>{
    const li=document.createElement('li');
    li.className = r.score>=90?'clean' : r.score>=70?'couv' : 'legal';
    const mine = me && r.pseudo===me.pseudo;
    const extra = kind==='season'
      ? `${t('kTreso')} ${cur(r.treasury||0)}`
      : `${t('lblCost')} ${cur(r.payroll||0)}`;
    li.innerHTML=`<span class="dot"></span><span class="txt">
        <b>${i+1}. ${r.pseudo}${mine?' <span style="color:var(--muted);font-weight:400">('+t('bdMe')+')</span>':''}</b>
        <span class="who">${extra}</span></span>
      <span class="pts" style="color:var(--ink);font-weight:600">${r.score}</span>`;
    if(kind!=='season'){                    // une saison, c'est dix grilles : pas rejouable ici
      li.style.cursor='pointer';
      li.onclick=()=>openReplay(kind,boardRef,r.pseudo,r.score);
    }
    ul.appendChild(li);
  });
}

/* Ouvre la grille d'un joueur en lecture seule. Les grilles sont
   stockées en base, c'est le meilleur outil d'apprentissage du jeu :
   voir comment le premier s'y est pris. */
async function openReplay(kind,ref,pseudo,score){
  let row=null;
  try{ row=await cloud.gridOf(kind,ref,pseudo); }catch(_){}
  if(!row||!row.grid){ toast(t('rpNone')); return; }
  let S=null;
  if(kind==='level') S=LEVELS.find(L=>L.id===ref);
  else {
    const m=/^([A-Z0-9]{1,12}):([1-5])$/.exec(ref);
    if(m) S=generateWeek(m[1],Number(m[2]));
  }
  if(!S){ toast(t('rpNone')); return; }
  scen=S; mode=(kind==='level'?'levels':'random');
  plan=applyLocks(S,Object.assign(emptyPlan(S),row.grid));
  replayInfo={pseudo,score:row.score!=null?row.score:score};
  show('play');
}

/* Historique personnel : une barre par tentative, la plus récente en haut. */
async function renderHistory(){
  $('#bd-histttl').textContent=t('histTtl');
  const ul=$('#bd-hist');
  if(!me){
    ul.innerHTML=`<li><span class="hd2"></span><span class="hl">${t('histGuest')}</span><span class="hs"></span></li>`;
    return;
  }
  ul.innerHTML=`<li><span class="hd2"></span><span class="hl">…</span><span class="hs"></span></li>`;
  let rows=[];
  try{ rows=await cloud.history(40); }catch(_){}
  if(!rows.length){
    ul.innerHTML=`<li><span class="hd2"></span><span class="hl">${t('histEmpty')}</span><span class="hs"></span></li>`;
    return;
  }
  const nom=r=>{
    if(r.mode==='season') return t('bdSeason');
    if(r.mode==='level'){ const L=LEVELS.find(l=>l.id===r.ref); return L?X(L.n):r.ref; }
    return r.ref.replace(':',' · ');
  };
  ul.innerHTML='';
  rows.forEach(r=>{
    const li=document.createElement('li');
    const d=new Date(r.created_at).toLocaleDateString(lang==='en'?'en-GB':'fr-FR',
      {day:'2-digit',month:'2-digit'});
    const col=r.score>=90?'var(--ok)':r.score>=70?'var(--warn)':'var(--bad)';
    li.innerHTML=`<span class="hd2">${d}</span>
      <span style="display:grid;gap:3px;min-width:0">
        <span class="hl">${nom(r)}</span>
        <span class="hbar"><i style="width:${r.score}%;background:${col}"></i></span>
      </span>
      <span class="hs">${r.score}</span>`;
    ul.appendChild(li);
  });
}

  const s=u.get('seed');
  if(s){
    rnd.seed=s.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12)||rnd.seed;
    const d=parseInt(u.get('d')||'2',10);
    rnd.diff=(d>=1&&d<=5)?d:2;
    show('random');
  } else show('home');
  refreshAccount();
})();
</script>
</body>
</html>
