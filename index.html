<style>
:root{
  --bg:#E3E8E1; --surface:#FDFDFC; --surface-2:#EFF2EC;
  --ink:#101513; --ink-2:#39433E; --muted:#68726C;
  --line:#CDD4CB; --line-strong:#A9B3A9;
  --midi:#A9500A; --midi-soft:#FBD59B;
  --prep:#6F5017; --prep-soft:#EEDBA3;
  --soir:#1F3E69; --soir-soft:#BCD1F2;
  --coup:#553571; --coup-soft:#DFC6F0;
  --repos:#7C867F; --repos-soft:#E9EDE7;
  --ok:#256B3E; --ok-soft:#D3E9DA;
  --warn:#8C5703; --warn-soft:#F8E6C2;
  --bad:#9E2B24; --bad-soft:#F7DAD6;
  --accent:#9E2B24;
  --shadow:0 1px 2px rgba(23,28,26,.06), 0 6px 18px -10px rgba(23,28,26,.22);
  --radius:6px;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1110; --surface:#151A18; --surface-2:#1D2321;
    --ink:#EEF3EE; --ink-2:#BAC4BD; --muted:#8E988F;
    --line:#2A322E; --line-strong:#3E4741;
    --midi:#F7B368; --midi-soft:#533814;
    --prep:#DCBB78; --prep-soft:#453A1C;
    --soir:#A6C4EF; --soir-soft:#223353;
    --coup:#D6B2E8; --coup-soft:#3B2C48;
    --repos:#8B958E; --repos-soft:#242B27;
    --ok:#86D3A2; --ok-soft:#142A1D;
    --warn:#EBBD69; --warn-soft:#332711;
    --bad:#F79488; --bad-soft:#3A1C18;
    --accent:#F79488;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1110; --surface:#151A18; --surface-2:#1D2321;
  --ink:#EEF3EE; --ink-2:#BAC4BD; --muted:#8E988F;
  --line:#2A322E; --line-strong:#3E4741;
  --midi:#F7B368; --midi-soft:#533814;
  --prep:#DCBB78; --prep-soft:#453A1C;
  --soir:#A6C4EF; --soir-soft:#223353;
  --coup:#D6B2E8; --coup-soft:#3B2C48;
  --repos:#8B958E; --repos-soft:#242B27;
  --ok:#86D3A2; --ok-soft:#142A1D;
  --warn:#EBBD69; --warn-soft:#332711;
  --bad:#F79488; --bad-soft:#3A1C18;
  --accent:#F79488;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
/* Chaque écran occupe au moins la hauteur de la fenêtre, pied de page
   collé en bas : sans cela, un écran court flottait dans le tiers haut
   d'un grand moniteur. */
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:24px 28px;
  min-height:100dvh;display:flex;flex-direction:column}
.wrap>section:not([hidden]){flex:1 1 auto;min-width:0}
footer.foot{margin-top:auto!important}
/* L'écran de jeu a droit à plus de largeur : c'est un tableau, pas de la lecture. */
.wrap.play{max-width:none}
h1,h2,h3{text-wrap:balance}

/* ---------- barre haute ---------- */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  padding-bottom:14px;border-bottom:2px solid var(--ink)}
.brandline{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin:0}
.topttl{font-family:"Fraunces",Georgia,serif;font-weight:800;font-size:20px;letter-spacing:-.01em;margin:0}
.topttl em{font-style:italic;font-weight:600;color:var(--accent)}
.grow{flex:1 1 auto;min-width:4px}
.pill{font:inherit;font-size:12px;background:var(--surface);color:var(--ink-2);
  border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.pill:hover{border-color:var(--line-strong);color:var(--ink)}

/* ---------- accueil ---------- */
.hero{padding-block:34px 26px;border-bottom:1px solid var(--line);margin-bottom:26px}
.hero .brandline{margin-bottom:10px}
.hero h1{font-family:"Fraunces",Georgia,serif;font-weight:800;
  font-size:clamp(36px,7vw,62px);line-height:.95;letter-spacing:-.025em;margin:0}
.hero h1 em{font-style:italic;font-weight:600;color:var(--accent)}
.hero p{margin:14px 0 0;color:var(--ink-2);max-width:56ch;font-size:16px}
.herogrid{display:grid;gap:30px}
.heroart{display:none}
@media(min-width:980px){
  .herogrid{grid-template-columns:minmax(0,1fr) minmax(300px,400px);align-items:center;gap:44px}
  .heroart{display:block}
}
.artgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.artgrid span{height:24px;border-radius:3px;background:var(--repos-soft)}
.artgrid span.P{background:var(--prep-soft);box-shadow:inset 3px 0 0 var(--prep)}
.artgrid span.M{background:var(--midi-soft);box-shadow:inset 3px 0 0 var(--midi)}
.artgrid span.S{background:var(--soir-soft);box-shadow:inset 3px 0 0 var(--soir)}
.artgrid span.C{background:var(--coup-soft);box-shadow:inset 3px 0 0 var(--coup)}
.artgrid span.d{height:auto;background:none;font-family:"IBM Plex Mono",monospace;
  font-size:10px;letter-spacing:.1em;color:var(--muted);text-align:center;padding-bottom:3px}
.artcap{margin:10px 0 0!important;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* étoiles : plus lisibles, avec le compte à côté */
.starline{font-size:17px}
.starcount{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);
  margin-left:8px;font-variant-numeric:tabular-nums}
.modes{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(232px,1fr))}
.mode{text-align:left;font:inherit;cursor:pointer;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);padding:18px;
  display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);
  transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--ink);transform:translateY(-2px)}
.mode .mk{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent)}
.mode .mt{font-family:"Fraunces",Georgia,serif;font-size:23px;font-weight:600;line-height:1.1}
.mode .md{color:var(--ink-2);font-size:13px;flex:1}
.mode .mf{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
  border-top:1px solid var(--line);padding-top:8px}

/* ---------- accueil : mise en scène ---------- */
.hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.btn.hero-go{font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:600;
  padding:14px 28px;border-radius:7px;letter-spacing:-.01em}
.btn.ghost{background:none;border-color:var(--line-strong);color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface);color:var(--ink)}

.playerbar{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 16px;margin-bottom:22px;box-shadow:var(--shadow)}
.playerbar .pb{display:grid;gap:1px}
.playerbar .pk{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.playerbar .pv{font-family:"Fraunces",Georgia,serif;font-size:20px;font-weight:600;
  line-height:1.05;font-variant-numeric:tabular-nums}
.playerbar .who{font-weight:600;font-size:15px}
.playerbar .spacer{flex:1 1 auto;min-width:4px}
.starline{display:flex;gap:2px;font-size:15px;letter-spacing:1px}
.starline i{font-style:normal;color:var(--line-strong)}
.starline i.on{color:var(--midi)}

.homecols{display:grid;gap:14px;grid-template-columns:1fr;margin-bottom:22px}
@media(min-width:820px){.homecols{grid-template-columns:1.25fr 1fr}}
.homecols>*{min-width:0}
.daily{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--midi);
  border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:9px}
.daily .dk{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--midi)}
.daily h3{font-family:"Fraunces",Georgia,serif;font-size:22px;font-weight:600;margin:0;
  padding:0;border:0;background:none;text-transform:none;letter-spacing:-.01em;color:var(--ink)}
.daily p{margin:0;color:var(--ink-2);font-size:13px}
.daily .dmeta{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
  display:flex;flex-wrap:wrap;gap:4px 16px}
.daily .dgo{margin-top:4px;align-self:flex-start}

.mini-board{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden}
.mini-board h3{margin:0;padding:11px 14px;font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--line);background:var(--surface-2);font-weight:500}
.mini-board ol{list-style:none;margin:0;padding:0}
.mini-board li{display:flex;gap:10px;align-items:baseline;padding:9px 14px;
  border-bottom:1px solid var(--line);font-size:13px}
.mini-board li:last-child{border-bottom:none}
.mini-board .rk{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);width:14px}
.mini-board .nm2{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-board .sc{font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums}
.mini-board .empty{color:var(--muted);font-size:12.5px}

/* Les classements ne sont pas un mode de jeu : bande pleine largeur,
   en négatif, pour qu'on ne la confonde pas avec les trois autres. */
.boardband{width:100%;text-align:left;font:inherit;cursor:pointer;margin-top:14px;
  background:var(--ink);color:var(--surface);border:1px solid var(--ink);
  border-radius:var(--radius);padding:16px 20px;display:flex;flex-wrap:wrap;
  gap:12px 24px;align-items:center;box-shadow:var(--shadow);
  transition:transform .15s,box-shadow .15s}
.boardband:hover{transform:translateY(-2px);box-shadow:0 10px 26px -14px rgba(0,0,0,.55)}
.boardband .bk{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;opacity:.6;display:block;margin-bottom:3px}
.boardband .bt{font-family:"Fraunces",Georgia,serif;font-size:24px;font-weight:600;
  line-height:1.05;letter-spacing:-.01em;display:block}
.boardband .bd{flex:1 1 280px;font-size:13px;opacity:.78;line-height:1.45}
.boardband .barrow{font-family:"Fraunces",Georgia,serif;font-size:26px;flex:none;opacity:.7}
.boardband .bchips{display:flex;gap:6px;flex-wrap:wrap}
.boardband .bchip{font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:3px 9px;opacity:.85}

/* entrée : une seule fois, au chargement */
/* L'état au repos est VISIBLE : l'animation ne fait que retarder l'entrée.
   Avec `backwards`, si elle ne se déclenche pas, le contenu s'affiche
   normalement au lieu de rester bloqué à opacity:0. */
.anim-in{animation:riseIn .5s ease backwards}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .anim-in{opacity:1;transform:none;animation:none}
}

/* ---------- tutoriel ---------- */
.tutobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:31;margin-top:16px;
  background:var(--ink);color:var(--surface);border-radius:var(--radius);
  padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;
  box-shadow:var(--shadow)}
.tutobar .tk{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;opacity:.65;flex:none}
.tutobar .tt{flex:1 1 260px;font-size:14px;line-height:1.45}
.tutobar .tt b{font-weight:600}
.tutobar .tbtn{font:inherit;font-size:13px;cursor:pointer;border-radius:5px;padding:6px 14px;
  border:1px solid rgba(255,255,255,.35);background:none;color:var(--surface)}
.tutobar .tbtn:hover{background:rgba(255,255,255,.12)}
.tutobar .tbtn.go{background:var(--surface);color:var(--ink);border-color:var(--surface);font-weight:600}
.tutobar .tbtn[disabled]{opacity:.4;cursor:default}
.tutobar .tdone{color:#7BC496;font-weight:600;font-size:13px}

/* ---------- rejeu d'une grille du classement ---------- */
.tutobar.replay{background:var(--soir);color:#fff}
.tutobar.replay .tbtn{border-color:rgba(255,255,255,.4)}
.cell.ro{cursor:default}
.cell.ro:hover{box-shadow:none}

/* ---------- brouillons ---------- */
.slots{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.slot{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;
  display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--surface-2)}
.slot.auto{border-style:dashed}
.slot .sn{flex:1 1 160px;min-width:0;display:grid;gap:2px}
.slot .sn input{font:inherit;font-size:13.5px;font-weight:600;padding:4px 7px;
  border:1px solid transparent;border-radius:4px;background:none;color:var(--ink);width:100%}
.slot .sn input:hover{border-color:var(--line)}
.slot .sn input:focus{border-color:var(--line-strong);background:var(--surface);outline:none}
.slot .sm{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);padding-left:7px}
.slot .ss{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;
  font-variant-numeric:tabular-nums;flex:none}
.slot .sb{display:flex;gap:6px;flex:none;flex-wrap:wrap}
.slot .sb button{font:inherit;font-size:12px;cursor:pointer;padding:5px 10px;border-radius:4px;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.slot .sb button:hover{background:var(--line)}
.slot .sb button.danger{color:var(--bad);border-color:var(--bad-soft)}
.slot.vide{opacity:.75}
.slot.vide .sn{color:var(--muted);font-style:italic;font-size:13px;padding-left:7px}

/* ---------- historique ---------- */
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:8px 14px;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:none}
.hist .hd2{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);
  white-space:nowrap}
.hist .hbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:40px}
.hist .hbar i{display:block;height:100%;border-radius:4px}
.hist .hs{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;
  font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
.hist .hl{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}

/* ---------- sélection de niveaux ---------- */
.pagehead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:18px}
.pagehead h2{font-family:"Fraunces",Georgia,serif;font-size:27px;font-weight:600;margin:0}
.pagehead .sub{color:var(--muted);font-size:13px}
.lvlgrid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:680px){.lvlgrid{grid-template-columns:repeat(2,1fr)}}
/* Deux colonnes plutôt que trois sur grand écran : cinq niveaux tiennent
   alors en trois rangées, les cartes respirent et la page ne finit plus
   par un grand vide. */
@media(min-width:1000px){.lvlgrid{grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;max-width:920px}}
.lcard{text-align:left;font:inherit;cursor:pointer;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;
  display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.lcard:hover{border-color:var(--line-strong)}
.lcard .lrow{display:flex;align-items:center;gap:8px}
.lcard .ln{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.lcard .lt{font-weight:600;font-size:17px;font-family:"Fraunces",Georgia,serif;letter-spacing:-.01em}
.lcard .ld{font-size:12.5px;color:var(--muted)}
.lcard .lb{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-2);
  border-top:1px solid var(--line);padding-top:7px;margin-top:2px;
  display:flex;justify-content:space-between;gap:8px}
.stars{margin-left:auto;display:flex;gap:2px;font-size:13px;letter-spacing:1px}
.stars i{font-style:normal;color:var(--line-strong)}
.stars i.on{color:var(--midi)}
.lcard.locked{opacity:.55;cursor:not-allowed}
.lcard.locked:hover{border-color:var(--line)}
/* Aperçu de la semaine : sept colonnes, hauteur proportionnelle à la charge,
   fermetures hachurées. On voit la forme du niveau avant de l'ouvrir. */
.lweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;
  align-items:end;height:42px;margin-top:4px}
.lweek i{display:block;border-radius:2px 2px 0 0;background:var(--soir-soft);
  box-shadow:inset 0 -3px 0 var(--soir)}
.lweek i.off{height:5px!important;background:
  repeating-linear-gradient(135deg,transparent 0 4px,var(--line) 4px 8px);box-shadow:none}
.lprog{height:5px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);
  overflow:hidden;margin-top:2px}
.lprog i{display:block;height:100%;background:var(--ok);border-radius:999px}
.lcard .lrules{display:flex;flex-wrap:wrap;gap:4px}
.lcard .lrules span{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.04em;
  border:1px solid var(--line);border-radius:999px;padding:2px 7px;color:var(--muted)}

/* ---------- saison ---------- */
.seasongrid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.seasongrid{grid-template-columns:1fr 330px;align-items:start}}
.seasongrid>*{min-width:0}
.weeks{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.wk{width:40px;height:40px;border-radius:5px;border:1px solid var(--line);
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);position:relative}
.wk.done{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.wk.done.mid{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.wk.done.low{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.wk.now{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink);font-weight:600}
.roster{list-style:none;margin:0;padding:0}
.roster li{display:grid;grid-template-columns:1fr 66px 66px;gap:8px;align-items:center;
  padding:9px 14px;border-bottom:1px solid var(--line)}
.roster li:last-child{border-bottom:none}
.roster .rn{font-size:13px;font-weight:600;line-height:1.2}
.roster .rr{font-size:11px;color:var(--muted)}
.roster .gauge{display:grid;gap:3px}
.roster .gauge span{font-family:"IBM Plex Mono",monospace;font-size:9px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gbar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:3px}
.roster li.out{opacity:.5}
.roster li.out .rn::after{content:" · arrêt";color:var(--bad);font-weight:400;font-size:11px}

/* ---------- aléatoire ---------- */
.randbox{display:grid;gap:16px;max-width:620px}
.field{display:grid;gap:6px}
.field label{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.field input[type=text],.field input[type=password],.field input[type=email]{
  font:inherit;font-family:"IBM Plex Mono",monospace;padding:9px 11px;
  border:1px solid var(--line-strong);border-radius:5px;background:var(--surface);color:var(--ink);width:100%}
.field input[type=range]{accent-color:var(--accent)}
.diffrow{display:flex;gap:6px;flex-wrap:wrap}
.diffrow button{font:inherit;font-size:13px;cursor:pointer;padding:7px 13px;border-radius:5px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.diffrow button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* ---------- brief ---------- */
/* Deux lignes, pas cinq : le titre et la phrase d'accroche sur la première,
   les compteurs et les règles sur la seconde. Le reste du brief est replié. */
.brief{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--radius);padding:11px 14px;display:grid;gap:7px;box-shadow:var(--shadow)}
.briefline{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 14px}
.brief h2{font-family:"Fraunces",Georgia,serif;font-size:18px;margin:0;font-weight:600;flex:none}
.brief p{margin:0;color:var(--ink-2);max-width:none;font-size:13.5px;flex:1 1 300px;min-width:0}
.briefmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
.briefstats{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:"IBM Plex Mono",monospace;
  font-size:11.5px;font-variant-numeric:tabular-nums}
.briefstats b{font-weight:600;color:var(--ink)}
.briefstats span{color:var(--muted)}
.rulechips{display:flex;flex-wrap:wrap;gap:6px}
.rulechip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.01em;
  cursor:help;white-space:nowrap}
.rulechip::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}

/* ---------- barre d'outils ---------- */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin-top:16px;padding:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:var(--shadow)}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;cursor:pointer;border-radius:5px;padding:5px 10px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink-2);display:flex;align-items:center;gap:7px;line-height:1.2}
.chip .key{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);
  border:1px solid var(--line-strong);border-radius:3px;padding:0 3px}
.chip .sw{width:10px;height:10px;border-radius:2px;flex:none}
.chip .hh{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.chip:hover{border-color:var(--line-strong)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip[aria-pressed="true"] .hh,.chip[aria-pressed="true"] .key{color:var(--surface);opacity:.75;border-color:currentColor}
.btn{font:inherit;cursor:pointer;border-radius:5px;padding:6px 14px;
  border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink)}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
.btn.primary:hover{opacity:.88}
.btn.big{padding:10px 20px;font-size:15px}
.btn.ico{font-size:17px;line-height:1;padding:6px 11px;font-family:system-ui,sans-serif}
.lnk{font:inherit;background:none;border:0;padding:0;color:var(--accent);
  text-decoration:underline;cursor:pointer}
.btn[disabled]{opacity:.38;cursor:default}
.btn[disabled]:hover{background:var(--surface-2)}

/* ---------- grille ---------- */
.gridwrap{margin-top:14px;overflow-x:auto;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
/* La grille se compresse au lieu de déborder : plus de défilement horizontal.
   Les colonnes n'ont pas de largeur plancher, ce sont les contenus qui s'allègent
   par paliers (nom du service, puis rôle, puis heures). */
.grid{display:grid;grid-template-columns:minmax(96px,1.4fr) repeat(7,minmax(0,1fr)) minmax(78px,1fr)}
.grid>*{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px 6px;
  min-height:44px;min-width:0;overflow:hidden}
.grid .nm,.grid .rl,.grid .code,.grid .hrs,.grid .sub,.grid .big,.grid .dn,.grid .ln b{
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid>.r-end{border-right:none}
.hd{background:var(--surface-2);font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;z-index:5;
  border-bottom:1px solid var(--line-strong);display:flex;flex-direction:column;justify-content:center;gap:1px}
.hd .dn{color:var(--ink);font-size:12px;letter-spacing:.04em}
.hd.closed .dn{color:var(--muted);text-decoration:line-through}
.namecell{position:sticky;left:0;z-index:4;background:var(--surface);
  display:flex;flex-direction:column;justify-content:center;gap:1px}
.hd.namecell{z-index:6;background:var(--surface-2)}
.namecell .nm{font-weight:700;font-size:14.5px;line-height:1.2}
.namecell .rl{font-size:12px;color:var(--muted)}
.namecell .rl .pole{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;border:1px solid var(--line-strong);border-radius:3px;padding:0 3px;margin-right:4px}
.namecell.cuisine{box-shadow:inset 3px 0 0 var(--midi)}
.namecell.salle{box-shadow:inset 3px 0 0 var(--soir)}
.cell{cursor:pointer;position:relative;display:flex;flex-direction:column;justify-content:center;
  gap:1px;user-select:none;-webkit-user-select:none;transition:box-shadow .1s}
.cell .code{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:13px;letter-spacing:.01em}
.cell .hrs{font-family:"IBM Plex Mono",monospace;font-size:11px;opacity:.8}
.cell:hover{outline:2px solid var(--line-strong);outline-offset:-2px;z-index:1}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cell.s-R{background:var(--repos-soft);color:var(--repos)}
.cell.s-P{background:var(--prep-soft);color:var(--prep);box-shadow:inset 4px 0 0 var(--prep)}
.cell.s-M{background:var(--midi-soft);color:var(--midi);box-shadow:inset 4px 0 0 var(--midi)}
.cell.s-S{background:var(--soir-soft);color:var(--soir);box-shadow:inset 4px 0 0 var(--soir)}
.cell.s-C{background:var(--coup-soft);color:var(--coup);box-shadow:inset 4px 0 0 var(--coup)}
/* la coupure est la case la plus coûteuse du jeu : elle se repère de loin */
.cell.s-C{background:
  repeating-linear-gradient(135deg,transparent 0 8px,rgba(0,0,0,.03) 8px 16px),var(--coup-soft)}
.cell.s-P,.cell.s-M,.cell.s-S,.cell.s-C{padding-left:11px}
.cell.locked{cursor:not-allowed;color:var(--muted);
  background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 5px,var(--line) 5px,var(--line) 6px)}
.cell.locked:hover{box-shadow:none}
.cell.closedday{opacity:.45}
.cell.flagged{box-shadow:inset 0 0 0 2px var(--bad)}
.cell.flagged::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;
  border-radius:50%;background:var(--bad)}
.totcell{display:flex;flex-direction:column;justify-content:center;gap:1px;
  font-family:"IBM Plex Mono",monospace;background:var(--surface-2);font-variant-numeric:tabular-nums}
.totcell .big{font-size:15px;font-weight:700}
.totcell .sub{font-size:10px;color:var(--muted)}
.totcell.over .big{color:var(--warn)}
.totcell.way .big{color:var(--bad)}
.totcell.under .big{color:var(--soir)}
.covrow{background:var(--surface-2)}
.covlabel{position:sticky;left:0;z-index:4;background:var(--surface-2);
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);display:flex;align-items:center}
.covcell{display:flex;flex-direction:column;justify-content:center;gap:2px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-variant-numeric:tabular-nums}
.covcell .ln{display:flex;justify-content:space-between;gap:6px}
.covcell .ln b{font-weight:600}
.covcell .pl{color:var(--muted);flex:none}
.covcell .short b{color:var(--bad)}
.covcell .okk b{color:var(--ok)}
.covcell .plus b{color:var(--warn)}
.covcell.none{color:var(--muted)}

/* ---------- vue mobile : un jour à la fois ---------- */
@media(max-width:700px){
  /* Les outils secondaires tiennent sur une seule ligne qui défile ;
     seule l'action principale occupe toute la largeur. */
  .toolbar{gap:6px;padding:8px;overflow-x:auto;flex-wrap:wrap}
  .toolbar .grow{display:none}
  .toolbar .btn{flex:0 0 auto;font-size:13px;padding:8px 11px}
  .toolbar .btn.ico{padding:8px 10px}
  .toolbar .btn.primary{flex:1 1 100%;order:9;padding:12px;font-size:16px}
  /* Brief : le titre, la phrase, puis les compteurs en petit. */
  .brief{padding:10px 12px;gap:5px}
  .brief h2{font-size:16px}
  .brief p{font-size:13px;flex:1 1 100%}
  .briefstats{font-size:11px;gap:4px 12px}
  .briefmeta{gap:5px 12px}
}
.daynav{display:flex;align-items:center;gap:8px;margin-top:14px}
.daynav button{font:inherit;cursor:pointer;background:var(--surface);color:var(--ink);
  border:1px solid var(--line-strong);border-radius:8px;padding:10px 14px;font-size:19px;line-height:1}
.daynav button[disabled]{opacity:.35}
.daynav .dcur{flex:1;text-align:center;display:grid;gap:2px}
.daynav .dcur b{font-family:"Fraunces",Georgia,serif;font-size:21px;font-weight:600}
.daynav .dcur span{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.daydots{display:flex;gap:5px;justify-content:center;margin-top:8px}
.daydots i{width:22px;height:5px;border-radius:3px;background:var(--line);display:block}
.daydots i.on{background:var(--ink)}
.daydots i.ko{background:var(--bad)}
.daydots i.okk{background:var(--ok)}

.dayneed{display:flex;gap:8px;margin-top:12px}
.dayneed div{flex:1;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:9px 11px;display:grid;gap:3px}
.dayneed .k{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.dayneed .v{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;
  display:flex;gap:10px;flex-wrap:wrap}
.dayneed .v s{text-decoration:none}
.dayneed .v s.short{color:var(--bad)} .dayneed .v s.okk{color:var(--ok)}

.dayrows{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:7px}
.dayrow{display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.dayrow.cuisine{box-shadow:inset 4px 0 0 var(--midi)}
.dayrow.salle{box-shadow:inset 4px 0 0 var(--soir)}
.dayrow .who2{flex:1;min-width:0;display:grid;gap:1px}
.dayrow .who2 b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayrow .who2 span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayrow .hrs2{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);flex:none}
.dayrow .pick{flex:none;font:inherit;font-family:"IBM Plex Mono",monospace;font-weight:700;
  font-size:15px;cursor:pointer;border-radius:7px;padding:11px 15px;min-width:64px;
  border:1px solid var(--line-strong);text-align:center}
.dayrow .pick.s-R{background:var(--repos-soft);color:var(--repos)}
.dayrow .pick.s-P{background:var(--prep-soft);color:var(--prep)}
.dayrow .pick.s-M{background:var(--midi-soft);color:var(--midi)}
.dayrow .pick.s-S{background:var(--soir-soft);color:var(--soir)}
.dayrow .pick.s-C{background:var(--coup-soft);color:var(--coup)}
.dayrow .pick[disabled]{opacity:.5;cursor:not-allowed}
.dayrow.flag{border-color:var(--bad)}

/* ---------- panneaux ---------- */
.cols{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
.cols>*{min-width:0}
/* Le panneau ne passe à côté de la grille que lorsqu'il reste assez de largeur
   pour les neuf colonnes ; en dessous il repasse dessous. */
@media(min-width:1280px){.cols{grid-template-columns:minmax(0,1fr) 300px;align-items:start}}

/* Paliers d'allègement */
@media(max-width:1180px){
  .grid>*{padding:6px 5px}
  .cell .code{font-size:11px}
}
@media(max-width:820px){
  .cell .lbl{display:none}
  .namecell .rl{font-size:10px}
  .grid{grid-template-columns:minmax(84px,1.3fr) repeat(7,minmax(0,1fr)) minmax(56px,.75fr)}
}
@media(max-width:640px){
  .grid>*{padding:5px 3px;min-height:40px}
  .namecell .rl .pole{display:none}
  .namecell .nm{font-size:12px}
  .namecell .rl{display:none}
  .covcell .pll{display:none}
  .totcell .sub{font-size:9px}
  .grid{grid-template-columns:minmax(72px,1.15fr) repeat(7,minmax(0,1fr)) minmax(50px,.7fr)}
}
@media(max-width:560px){
  .cell .hrs{display:none}
  .totcell .sub{display:none}
  .totcell .big{font-size:12px}
  .hd .dn{font-size:11px}
  .hd span:not(.dn){display:none}
  .covcell{font-size:10px}
  .grid{grid-template-columns:minmax(64px,1fr) repeat(7,minmax(0,1fr)) minmax(44px,.62fr)}
}
.covcell .pls{display:none}
@media(max-width:640px){.covcell .pls{display:inline}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden}
.panel h3{margin:0;padding:11px 14px;font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--line);background:var(--surface-2);font-weight:500}
.scorebox{padding:14px;display:grid;gap:12px}
.scoreline{display:flex;align-items:baseline;gap:10px}
.scorenum{font-family:"Fraunces",Georgia,serif;font-weight:800;font-size:54px;line-height:.85;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em;transition:color .25s}
.scorenum.g{color:var(--ok)} .scorenum.w{color:var(--warn)} .scorenum.b{color:var(--bad)}
.scoreof{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.rank{margin-left:auto;font-size:11px;font-weight:700;padding:4px 11px;border-radius:999px;
  text-transform:uppercase;letter-spacing:.06em}
.rank.g{background:var(--ok-soft);color:var(--ok)}
.rank.w{background:var(--warn-soft);color:var(--warn)}
.rank.b{background:var(--bad-soft);color:var(--bad)}
.meter{display:grid;gap:4px}
.meter .mtop{display:flex;justify-content:space-between;gap:8px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-variant-numeric:tabular-nums}
.meter .mtop span{color:var(--muted)}
.bar{height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden;
  border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:999px;transition:width .35s ease}
.issues{list-style:none;margin:0;padding:0}
.issues li{display:flex;gap:9px;padding:9px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.issues li:last-child{border-bottom:none}
.issues .dot{width:7px;height:7px;border-radius:50%;flex:none;margin-top:6px}
.issues .txt{flex:1;font-size:14px;line-height:1.45}
.issues .txt b{font-weight:600}
.issues .who{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.issues .pts{font-family:"IBM Plex Mono",monospace;font-size:11px;flex:none}
.issues li.legal .dot{background:var(--bad)} .issues li.legal .pts{color:var(--bad)}
.issues li.couv .dot{background:var(--warn)} .issues li.couv .pts{color:var(--warn)}
.issues li.eco .dot{background:var(--soir)} .issues li.eco .pts{color:var(--soir)}
.issues li.conf .dot{background:var(--coup)} .issues li.conf .pts{color:var(--coup)}
.issues li.clean{color:var(--ok)}
.issues li.clean .dot{background:var(--ok)}
.rules{padding:0 14px 14px}
.rules summary{cursor:pointer;padding:11px 0;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.rules summary:hover{color:var(--ink)}
.rules ul{margin:0 0 10px;padding-left:18px;color:var(--ink-2);font-size:12.5px;display:grid;gap:5px}
.rules code{font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:3px;padding:0 4px}
.disclaim{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px;margin:0}

/* ---------- débrief ---------- */
/* Modale centrée. Grille plutôt que flex : le contenu trop haut se
   défile sans que le haut du panneau soit coupé. */
.ovl{position:fixed;top:0;left:0;right:0;bottom:0;z-index:70;
  background:rgba(10,14,12,.62);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  display:grid;place-items:center;padding:16px;overflow-y:auto;overscroll-behavior:contain}
.sheet{background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;
  box-shadow:0 30px 70px -22px rgba(0,0,0,.6);max-width:620px;width:100%;margin:auto;
  max-height:calc(100dvh - 32px);overflow-y:auto;
  animation:popIn .18s ease-out}
@keyframes popIn{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
body.locked{overflow:hidden}
.sheet header{padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.sheet header .ek{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.sheet header h2{font-family:"Fraunces",Georgia,serif;font-size:27px;font-weight:600;margin:0}
.sheet .body{padding:16px 22px 20px;display:grid;gap:14px}
.deltas{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.deltas li{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45}
.deltas .tag{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 6px;border-radius:3px;flex:none;margin-top:1px}
.deltas .tag.good{background:var(--ok-soft);color:var(--ok)}
.deltas .tag.bad{background:var(--bad-soft);color:var(--bad)}
.deltas .tag.warn{background:var(--warn-soft);color:var(--warn)}
.deltas .tag.info{background:var(--surface-2);color:var(--ink-2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:5px;padding:10px 12px;background:var(--surface-2)}
.kpi .kl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.kpi .kv{font-family:"Fraunces",Georgia,serif;font-size:24px;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .kv.g{color:var(--ok)} .kpi .kv.b{color:var(--bad)}
.sheet footer{padding:0 22px 20px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);
  padding:10px 18px;border-radius:999px;font-size:13px;z-index:80;box-shadow:var(--shadow);
  max-width:min(90vw,520px);text-align:center}
.hint{font-size:12px;color:var(--muted);margin:10px 2px 0}
kbd{font-family:"IBM Plex Mono",monospace;font-size:11px;border:1px solid var(--line-strong);

<body>
<div class="wrap">

<!-- ===== barre haute (masquée sur l'accueil) ===== -->
<div class="topbar" id="topbar" hidden>
  <button class="pill" id="btnHome" type="button">← Menu</button>
  <p class="topttl">Planning<em>Master</em></p>
  <span class="grow"></span>
  <button class="pill" id="accountbtn" type="button">Compte</button>
  <button class="pill" id="langbtn" type="button">EN</button>
  <button class="pill" id="themebtn" type="button">Thème</button>
</div>

<!-- ===== écran : accueil ===== -->
<section id="scr-home">
  <div class="hero anim-in" style="animation-delay:0s">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;justify-content:flex-end">
      <button class="pill" id="accountbtn2" type="button">Compte</button>
      <button class="pill" id="langbtn2" type="button">EN</button>
      <button class="pill" id="themebtn2" type="button">Thème</button>
    </div>
    <div class="herogrid">
      <div class="heromain">
        <p class="brandline" id="h-brand"></p>
        <h1>Planning<em>Master</em></h1>
        <p id="h-tag"></p>
        <div class="cta">
          <button class="btn primary hero-go" id="h-go" type="button"></button>
          <button class="btn ghost" id="h-alt" type="button"></button>
        </div>
      </div>
      <!-- Décor : une semaine type, pour qu'on voie de quoi il s'agit avant
           d'avoir lu une ligne. Aucune donnée, aucun état. -->
      <div class="heroart" aria-hidden="true">
        <div class="artgrid" id="h-art"></div>
        <p class="artcap" id="h-artcap"></p>
      </div>
    </div>
  </div>

  <div class="playerbar anim-in" id="h-player" style="animation-delay:.08s"></div>

  <div class="homecols">
    <div class="daily anim-in" id="h-daily" style="animation-delay:.16s"></div>
    <div class="mini-board anim-in" style="animation-delay:.24s">
      <h3 id="h-topttl"></h3>
      <ol id="h-top"></ol>
    </div>
  </div>

  <div class="modes anim-in" id="modes" style="animation-delay:.32s"></div>
  <button class="boardband anim-in" id="h-board" type="button" style="animation-delay:.4s"></button>
</section>

<!-- ===== écran : niveaux ===== -->
<section id="scr-levels" hidden>
  <div class="pagehead"><h2 id="lv-title"></h2><span class="sub" id="lv-sub"></span></div>
  <div class="lvlgrid" id="lvlgrid"></div>
</section>

<!-- ===== écran : saison ===== -->
<section id="scr-season" hidden>
  <div class="pagehead"><h2 id="sn-title"></h2><span class="sub" id="sn-sub"></span></div>
  <div class="weeks" id="sn-weeks"></div>
  <div class="seasongrid">
    <div style="display:grid;gap:16px">
      <div class="brief">
        <h2 id="sn-wtitle"></h2>
        <p id="sn-wtext"></p>
        <div class="briefstats" id="sn-wstats"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary big" id="sn-play" type="button"></button>
        <button class="btn" id="sn-reset" type="button"></button>
      </div>
      <div class="panel">
        <h3 id="sn-logttl"></h3>
        <ul class="issues" id="sn-log"></ul>
      </div>
    </div>
    <div style="display:grid;gap:16px">
      <div class="panel">
        <h3 id="sn-kpittl"></h3>
        <div class="scorebox"><div class="kpis" id="sn-kpis"></div></div>
      </div>
      <div class="panel">
        <h3 id="sn-teamttl"></h3>
        <ul class="roster" id="sn-roster"></ul>
      </div>
    </div>
  </div>
</section>

<!-- ===== écran : aléatoire ===== -->
<section id="scr-random" hidden>
  <div class="pagehead"><h2 id="rd-title"></h2><span class="sub" id="rd-sub"></span></div>
  <div class="randbox">
    <div class="field">
      <label id="rd-difflbl"></label>
      <div class="diffrow" id="rd-diff"></div>
    </div>
    <div class="field">
      <label for="rd-seed" id="rd-seedlbl"></label>
      <input type="text" id="rd-seed" maxlength="12" autocomplete="off" spellcheck="false">
      <span class="sub" style="color:var(--muted);font-size:12px" id="rd-seedhelp"></span>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary big" id="rd-play" type="button"></button>
      <button class="btn" id="rd-roll" type="button"></button>
    </div>
    <div class="panel">
      <h3 id="rd-prevttl"></h3>
      <div class="scorebox">
        <div class="briefstats" id="rd-preview"></div>
        <div class="lweek" id="rd-week" aria-hidden="true"></div>
        <div class="rulechips" id="rd-rules"></div>
      </div>
    </div>
  </div>
</section>

<!-- ===== écran : classements ===== -->
<section id="scr-board" hidden>
  <div class="pagehead"><h2 id="bd-title"></h2><span class="sub" id="bd-sub"></span></div>
  <div class="diffrow" id="bd-tabs" style="margin-bottom:16px"></div>
  <div class="panel">
    <h3 id="bd-h3"></h3>
    <ul class="issues" id="bd-list"></ul>
  </div>
  <div class="panel" style="margin-top:16px">
    <h3 id="bd-histttl"></h3>
    <ul class="hist" id="bd-hist"></ul>
  </div>
</section>

<!-- ===== écran : jeu ===== -->
<section id="scr-play" hidden>
  <div class="tutobar" id="tutobar" hidden></div>
  <div class="brief">
    <div class="briefline">
      <h2 id="briefTitle"></h2>
      <p id="briefText"></p>
    </div>
    <div class="briefmeta">
      <div class="briefstats" id="briefStats"></div>
      <div class="rulechips" id="ruleChips"></div>
    </div>
  </div>

  <div class="toolbar">
    <div class="palette" id="palette"></div>
    <span class="grow"></span>
    <button class="btn" id="btnClear" type="button"></button>
    <button class="btn" id="btnDraft" type="button" hidden></button>
    <button class="btn ico" id="btnHelp" type="button">?</button>
    <button class="btn ico" id="btnUndo" type="button">&#8630;</button>
    <button class="btn ico" id="btnRedo" type="button">&#8631;</button>
    <button class="btn" id="btnSlots" type="button"></button>
    <button class="btn primary" id="btnCheck" type="button"></button>
  </div>

  <div class="cols">
    <div>
      <div class="gridwrap" id="gridwrap"><div class="grid" id="grid"></div></div>
      <div id="dayview" hidden></div>
    </div>
    <aside style="display:grid;gap:16px">
      <div class="panel">
        <h3 id="h3board"></h3>
        <div class="scorebox">
          <div class="scoreline">
            <span class="scorenum" id="score">·</span>
            <span class="scoreof">/ 100</span>
            <span class="rank" id="rank"></span>
          </div>
          <div class="meter">
            <div class="mtop"><span id="lblCost"></span><b id="costTxt">·</b></div>
            <div class="bar"><i id="costBar" style="width:0%;background:var(--ok)"></i></div>
          </div>
          <div class="meter">
            <div class="mtop"><span id="lblCov"></span><b id="covTxt">·</b></div>
            <div class="bar"><i id="covBar" style="width:0%;background:var(--ok)"></i></div>
          </div>
          <button class="btn" id="btnShare" type="button" style="justify-content:center"></button>
        </div>
      </div>
      <div class="panel">
        <h3 id="h3live"></h3>
        <ul class="issues" id="issues"></ul>
      </div>

    </aside>
  </div>
</section>

<footer class="foot"><span id="h-footL"></span><span id="h-footR"></span></footer>
</div>

let lang = "fr";
const t = k => T[lang][k];
const X = o => (o && typeof o==='object' && o.fr!==undefined) ? o[lang] : o;

/* ======================= moteur ======================= */
// Le moteur vit dans game-core.js : même code pour la page et pour
// l'Edge Function qui revalide les scores. Voir supabase/functions/.

/* --- formatage : dépend de la langue, donc ici et pas dans le moteur --- */
function fmtH(h){
  const hh=Math.floor(h+1e-9), mm=Math.round((h-hh)*60);
  if(lang==='en') return mm?`${hh}h${String(mm).padStart(2,'0')}`:`${hh}h`;
  return mm?`${hh} h ${String(mm).padStart(2,'0')}`:`${hh} h`;
}
const nf = n => Math.round(n).toLocaleString(lang==='en'?'en-GB':'fr-FR');
const cur = v => lang==='en' ? `€${nf(v)}` : `${nf(v)} €`;

/* --- traduction des codes renvoyés par le moteur --- */
function fmtIssue(i){
  const a=i.a, D=t('days'), Ds=t('daysShort'), SV=t('services');
  switch(i.code){
    case 'REST':   return [t('iRest')(fmtH(a.h),Ds[a.d1],Ds[a.d2]), t('iRestWho')(a.nom)];
    case 'OFF':    return [t('iOff'), t('iOffWho')(a.nom,a.repos)];
    case 'CONSEC': return [t('iConsec'), t('iConsecWho')(a.nom)];
    case 'MAX48':  return [t('i48')(fmtH(a.h)), t('i48Who')(a.nom)];
    case 'PAID':   return [t('iPaid')(fmtH(a.perdu)), t('iPaidWho')(a.nom,a.contrat,fmtH(a.h))];
    case 'COVER':  return [t('iCover')(D[a.jour],SV[a.sv],a.manque,a.pole),
                           t('iCoverWho')(a.present,a.need,a.pole)];
    case 'LEAD':   return [t('iResp')(D[a.jour],SV[a.sv],a.pole), t('iRespWho')(a.pole)];
    case 'APPR_SOIR': return [t('iApprSoir')(a.n), t('iApprSoirWho')(a.nom)];
    case 'APPR_H':    return [t('iApprH')(fmtH(a.h)), t('iApprHWho')(a.nom)];
    case 'WISH':   return [t('iWish'), X(a.txt)];
    case 'BUDGET': return [t('iBudget')(nf(a.over)), t('iBudgetWho')(nf(a.total),nf(a.budget))];
    default:       return [i.code, ''];
  }
}
function fmtDelta(d){
  const a=d.a||{};
  switch(d.code){
    case 'TRESO':     return t('dTreso')(nf(a.gain));
    case 'ARRET':     return t('dArret')(a.nom);
    case 'FATIGUE':   return t('dFatigue')(a.nom);
    case 'QUIT':      return t('dQuit')(a.nom);
    case 'MORAL':     return t('dMoral')(a.nom);
    case 'HS_WARN':   return t('dHSwarn')(a.nom);
    case 'HS':        return t('dHS')(a.nom,fmtH(a.h));
    case 'GOOD_REST': return t('dGoodRest');
    case 'WISHES':    return t('dWishes');
    default:          return d.code;
  }
}
// Titre et brief d'une semaine générée : construits ici, pas dans le moteur.
function randomLabels(S){
  const d=t('diffs')[S.diff-1];
  // Vérifié au solveur : jusqu'à « Tendue » une solution à 100 existe
  // toujours. Au-delà, les contrats sont volontairement trop courts pour
  // la charge, et certaines semaines plafonnent sous 100.
  const garanti = S.diff<=3;
  const base = lang==='en'
    ? `Generated week, difficulty "${d}". ${S.openDays} days open, ${S.equipe.length} staff.`
    : `Semaine générée, difficulté « ${d} ». ${S.openDays} jours ouverts, ${S.equipe.length} salariés.`;
  const suite = lang==='en'
    ? (garanti ? ' A 100/100 solution exists, the seed guarantees it.'
               : ' At this level a perfect score is not guaranteed: the contracts are deliberately too short for the workload.')
    : (garanti ? ' Une solution à 100/100 existe, la graine le garantit.'
               : ' À ce niveau le 100 n\'est pas garanti : les contrats sont volontairement trop courts pour la charge.');
  return { titre:d, brief: base+suite };
}

/* ======================= état ======================= */
let screen='home', mode=null, scen=null, plan=null, brush='C', painting=false;
let progress={}, season=null, rnd={seed:randomSeed(),diff:2};

function emptyPlan(S){const p={};S.equipe.forEach(em=>{p[em.id]=[0,0,0,0,0,0,0].map(()=> 'R');});return p;}
function applyLocks(S,p){
  S.equipe.forEach(em=>{if(em.indispo)Object.keys(em.indispo).forEach(d=>{p[em.id][+d]='R';});});
  S.jours.forEach((j,d)=>{if(j.ferme)S.equipe.forEach(em=>{p[em.id][d]='R';});});
  return p;
}
function isLocked(S,em,d){return (em.indispo&&em.indispo[d]!==undefined)||S.jours[d].ferme;}

function save(){
  try{ localStorage.setItem('cdf_v3',JSON.stringify({lang,progress,season,rnd})); }catch(_){}
}
function load(){
  try{
    const raw=localStorage.getItem('cdf_v3'); if(!raw)return;
    const d=JSON.parse(raw);
    if(d.lang&&T[d.lang])lang=d.lang;
    if(d.progress)progress=d.progress;
    if(d.season)season=d.season;
    if(d.rnd)rnd=d.rnd;
  }catch(_){}
}
const stars = s => s>=100?3 : s>=80?2 : s>=60?1 : 0;

/* ======================= rendu ======================= */
const $=s=>document.querySelector(s);
const SCREENS=['home','levels','season','random','board','play'];
function show(name){
  screen=name;
  SCREENS.forEach(s=>{ $('#scr-'+s).hidden = (s!==name); });
  $('#topbar').hidden = (name==='home');
  document.querySelector('.wrap').classList.toggle('play',name==='play');
  window.scrollTo(0,0);
  renderChrome();
  if(name==='home')   renderHome();
  if(name==='levels') renderLevels();
  if(name==='season') renderSeason();
  if(name==='random') renderRandom();
  if(name==='board')  renderBoard();
  if(name==='play')   renderPlay();
}

function renderChrome(){
  document.documentElement.setAttribute('lang',t('html'));
  ['#langbtn','#langbtn2'].forEach(s=>{const el=$(s);if(el)el.textContent=t('other');});
  ['#themebtn','#themebtn2'].forEach(s=>{const el=$(s);if(el)el.textContent=t('theme');});
  $('#btnHome').textContent=t('menu');
  refreshAccount();
}

function totalStars(){
  return LEVELS.reduce((a,L)=>a+stars(progress[L.id]||0),0);
}
function heroAction(){
  const joue = LEVELS.some(L=>progress[L.id]);
  if(!progress.tuto && !joue) return {key:'tuto', label:t('ctaTuto')};
  if(season && season.week>0 && season.week<SEASON_WEEKS.length)
    return {key:'season', label:t('ctaSeason')(season.week+1)};
  const next = LEVELS.find(L=>(progress[L.id]||0)<100) || LEVELS[0];
  return {key:'level', level:next, label:t('ctaResume')(X(next.n))};
}

   de la partie : c'est une vignette, pas un aperçu. */
const ART = ['CCSRRCM','PMCSCRR','RSCCSMR','SCRPCSR','MRPCSCR'];
function renderArt(){
  const g=$('#h-art'); if(!g) return;
  const jours=t('daysShort');
  g.innerHTML = jours.map(j=>`<span class="d">${j.slice(0,3).toUpperCase()}</span>`).join('')
    + ART.map(r=>[...r].map(c=>`<span class="${c==='R'?'':c}"></span>`).join('')).join('');
  $('#h-artcap').textContent=t('artCap');
}

      <div class="pb"><span class="pk">${t('pbStars')}</span>
        <span class="starline">${Array.from({length:max},(_,k)=>
          `<i class="${k<st?'on':''}">★</i>`).join('')}<span class="starcount">${st}/${max}</span></span></div>

    const b=$('#pb-in'); if(b) b.onclick=openAuth;
  }

  // défi du jour
  const seed=dailySeed();
  const fait = progress.daily && progress.daily.seed===seed ? progress.daily.score : null;

    <span class="dk">${t('dTtl')}</span>
    <h3>${jour.charAt(0).toUpperCase()+jour.slice(1)}</h3>

      ${fait!==null?`<span style="color:var(--ok)">${t('dDoneS')(fait)}</span>`:''}</div>
    <button class="btn primary dgo" id="h-dgo" type="button">${fait!==null?t('dAgain'):t('dGo')}</button>`;

    ol.innerHTML='';
    if(!rows.length){
      ol.innerHTML=`<li><span class="empty">${t('topEmpty')}</span></li>`;

/* Les règles en vigueur sur l'épreuve en cours, en une ligne de puces.
   Le détail est dans l'aide : ici on rappelle seulement ce qui change. */
function activeRules(S){
  const R=(S&&S.regles)||{};
  return RULES_ORDER.filter(k=>R[k]);
}
function renderRuleChips(S){
  const w=$('#ruleChips'); if(!w) return;

    ? on.map(k=>`<span class="rulechip" title="${t('ruleTxt')[k]}">${t('ruleShort')[k]}</span>`).join('')
    : `<span class="rulechip" style="opacity:.6">${t('noRules')}</span>`;
}

function renderPalette(){

function renderGrid(S,p,ev){
  const g=$('#grid'); g.innerHTML='';
  const D=t('days');
  const add=(cls,html,last)=>{const d=document.createElement('div');
    d.className=cls+(last?' r-end':'');d.innerHTML=html;g.appendChild(d);return d;};
  add('hd namecell',`<span class="dn">${t('team')}</span>`);
  S.jours.forEach((j,d)=>{
    const sub=j.note?t('notes')[j.note]
      :`${t('midiCount')(j.besoin.midi.cuisine+j.besoin.midi.salle)} · ${t('soirCount')(j.besoin.soir.cuisine+j.besoin.soir.salle)}`;
    add('hd'+(j.ferme?' closed':''),`<span class="dn">${D[d]}</span><span>${sub}</span>`);
  });
  add('hd',`<span class="dn">${t('total')}</span><span>${t('contract')}</span>`,true);
  S.equipe.forEach(em=>{
    add('namecell '+em.pole,
      `<span class="nm">${em.nom}</span><span class="rl"><span class="pole">${t('poleShort')[em.pole]}</span>${t('roles')[em.role]}${em.resp?' ·&nbsp;'+t('resp'):''}</span>`);
    S.jours.forEach((j,d)=>{
      const code=p[em.id][d], s=SHIFTS[code];
      const lock=isLocked(S,em,d);
      const motif=em.indispo&&em.indispo[d];
      const cls=['cell','s-'+code];
      if(lock)cls.push('locked');
      if(j.ferme)cls.push('closedday');
      if(ev.flags.has(em.id+'-'+d))cls.push('flagged');
      const label=lock?(motif?t('motifs')[motif]:t('motifs').ferme):t('shifts')[code];
      const sub=lock?'':(s.h?fmtH(s.h):'·');
      const c=add(cls.join(' '),
        lock
          ? `<span class="code"><span class="lbl">${label}</span></span>`
          : `<span class="code">${code}<span class="lbl"> · ${label}</span></span><span class="hrs">${sub}</span>`);
      c.title=lock?label:`${t('shifts')[code]}${s.label?' · '+s.label:''}`;
      if(replayInfo) c.classList.add('ro');
      if(!lock && !replayInfo){
        c.tabIndex=0;
        c.addEventListener('pointerdown',e2=>{e2.preventDefault();painting=true;setCell(em.id,d,brush);});
        c.addEventListener('pointerenter',()=>{if(painting)setCell(em.id,d,brush);});
        c.addEventListener('keydown',ke=>{
          if(KEYMAP[ke.key]){ke.preventDefault();setCell(em.id,d,KEYMAP[ke.key]);}
          else if(ke.key==='Enter'||ke.key===' '){ke.preventDefault();setCell(em.id,d,brush);}
        });
      }
    });
    const h=ev.hours[em.id], diff=h-em.contrat;
    let tc='totcell';
    if(diff>4)tc+=' way'; else if(diff>0.01)tc+=' over'; else if(diff<-0.01)tc+=' under';
    add(tc,`<span class="big">${fmtH(h)}</span><span class="sub">/${em.contrat}h · ${cur(ev.cost[em.id])}</span>`,true);
  });
  ['midi','soir'].forEach(sv=>{
    add('covrow covlabel',t('needFor')(t('services')[sv]));
    S.jours.forEach((j,d)=>{
      const nc=j.besoin[sv].cuisine, ns=j.besoin[sv].salle;
      if(nc+ns===0){add('covrow covcell none','<span class="ln">·</span>');return;}
      const cnt=pole=>S.equipe.filter(em=>em.pole===pole&&SHIFTS[p[em.id][d]].couvre.includes(sv)).length;
      const line=(pole,got,need)=>{
        if(need===0)return '';
        const k=got<need?'short':(got>need?'plus':'okk');
        const lg=t('poleShort')[pole], sh=lg[0];
        return `<span class="ln ${k}"><span class="pl"><span class="pll">${lg}</span><span class="pls">${sh}</span></span><b>${got}/${need}</b></span>`;
      };
      add('covrow covcell',line('cuisine',cnt('cuisine'),nc)+line('salle',cnt('salle'),ns));
    });
    add('covrow covcell none','',true);
  });
}
function renderPanel(S,ev){
  $('#score').textContent=ev.score;

  r.className='rank '+niv;

  $('#covTxt').textContent=`${ev.postesOK} / ${ev.postesTot}`;

  vb.style.width=pctCov+'%';
  vb.style.background=pctCov>=100?'var(--ok)':(pctCov>=90?'var(--warn)':'var(--bad)');

  if(!ev.issues.length){
    ul.innerHTML=`<li class="clean"><span class="dot"></span><span class="txt">${t('clean')}</span></li>`;
    return;
  }
  const rk={legal:0,couv:1,eco:2,conf:3};
  const sorted=ev.issues.slice().sort((a,c)=>(rk[a.cat]-rk[c.cat])||(c.pts-a.pts));
  const VU=3;
  sorted.slice(0,VU).forEach(i=>{
    const li=document.createElement('li');
    li.className=i.cat;
    const [ttl,who]=fmtIssue(i);
    li.innerHTML=`<span class="dot"></span><span class="txt"><b>${ttl}</b><span class="who">${who}</span></span><span class="pts">−${i.pts}</span>`;
    ul.appendChild(li);
  });
  if(sorted.length>VU){
    const reste=sorted.slice(VU), pts=reste.reduce((a,i)=>a+i.pts,0);
    const li=document.createElement('li');
    li.innerHTML=`<span class="dot" style="background:var(--muted)"></span>
      <span class="txt">${t('more')(reste.length)}</span><span class="pts">-${pts}</span>`;
    li.style.cursor='pointer';
    li.onclick=()=>{ openRules(sorted); };
    ul.appendChild(li);
  }
}
function setCell(empId,d,code){
  if(replayInfo) return;          // grille d'un autre joueur : on ne touche pas
  const em=scen.equipe.find(x=>x.id===empId);
  if(!em||isLocked(scen,em,d)||plan[empId][d]===code)return;
  pushHistory();
  plan[empId][d]=code;
  if(mode==='season'&&season) season.plan=plan;
  save();
  scheduleAutosave();
  renderPlay();
}

/* ---------- actions ---------- */
let toastT;
/* Ouvre une modale : verrouille le défilement, ferme au clic sur le fond
   et à la touche Échap. */
function mountOvl(ovl){
  document.body.appendChild(ovl);
  document.body.classList.add('locked');
  const close=()=>{
    ovl.remove();
    document.body.classList.remove('locked');
    document.removeEventListener('keydown',onKey);
  };
  const onKey=e=>{ if(e.key==='Escape') close(); };
  document.addEventListener('keydown',onKey);
  ovl.addEventListener('mousedown',e=>{ if(e.target===ovl) close(); });
  const obs=new MutationObserver(()=>{
    if(!document.body.contains(ovl)){
      document.body.classList.remove('locked');
      document.removeEventListener('keydown',onKey);
      obs.disconnect();
    }
  });

  return close;
}

/* ---------- vue mobile : un jour à la fois ---------- */
/* Neuf colonnes sur un téléphone, ce n'est pas jouable. Sous 700 px on
   bascule sur une journée à la fois : l'équipe en liste, un gros bouton
   de service par personne, et on glisse pour changer de jour. */

function prochainCode(c){ return ORDER[(ORDER.indexOf(c) + 1) % ORDER.length]; }

function renderDayView(S, p, ev){
  const hote = $('#dayview');
  const D = t('days');
  // on se cale sur un jour ouvert
  let sec = 0;
  while(S.jours[jourVu] && S.jours[jourVu].ferme && sec++ < 7) jourVu = (jourVu + 1) % 7;
  const j = S.jours[jourVu];

  const couvert = (sv,pole) => S.equipe.filter(em =>
    em.pole===pole && SHIFTS[p[em.id][jourVu]].couvre.includes(sv)).length;
  const bloc = sv => {
    if(!j.besoin[sv].cuisine && !j.besoin[sv].salle)
      return `<div><span class="k">${t('services')[sv]}</span><span class="v">${t('notes').soirFerme}</span></div>`;
    const part = pole => {
      const need = j.besoin[sv][pole]; if(!need) return '';
      const got = couvert(sv,pole);
      return `<s class="${got<need?'short':'okk'}">${t('poleShort')[pole]} ${got}/${need}</s>`;
    };
    return `<div><span class="k">${t('services')[sv]}</span>
      <span class="v">${part('cuisine')}${part('salle')}</span></div>`;
  };

  const etatJour = d => {
    if(S.jours[d].ferme) return '';
    const manque = ['midi','soir'].some(sv => ['cuisine','salle'].some(pole => {
      const need = S.jours[d].besoin[sv][pole];
      return need && S.equipe.filter(em => em.pole===pole
        && SHIFTS[p[em.id][d]].couvre.includes(sv)).length < need;
    }));
    return manque ? 'ko' : 'okk';
  };

  hote.innerHTML = `
    <div class="daynav">
      <button id="dv-prev" type="button" aria-label="${D[(jourVu+6)%7]}">&#8249;</button>
      <span class="dcur"><b>${D[jourVu]}</b><span>${j.note ? t('notes')[j.note] : ''}</span></span>
      <button id="dv-next" type="button" aria-label="${D[(jourVu+1)%7]}">&#8250;</button>
    </div>
    <div class="daydots">${S.jours.map((x,d)=>
      `<i class="${d===jourVu?'on':etatJour(d)}"></i>`).join('')}</div>
    ${j.ferme ? '' : `<div class="dayneed">${bloc('midi')}${bloc('soir')}</div>`}
    <ul class="dayrows">${S.equipe.map(em=>{
      const code = p[em.id][jourVu];
      const lock = isLocked(S,em,jourVu);
      const motif = em.indispo && em.indispo[jourVu];
      const h = ev.hours[em.id];
      const flag = ev.flags.has(em.id+'-'+jourVu);
      return `<li class="dayrow ${em.pole}${flag?' flag':''}">
        <span class="who2"><b>${em.nom}</b><span>${t('roles')[em.role]} · ${fmtH(h)} / ${em.contrat} h</span></span>
        <button class="pick s-${code}" data-emp="${em.id}" ${lock||replayInfo?'disabled':''}>
          ${lock ? (motif ? t('motifs')[motif] : t('motifs').ferme) : code}
        </button></li>`;
    }).join('')}</ul>`;

  const bouge = n => { jourVu = (jourVu + n + 7) % 7;
    let g=0; while(S.jours[jourVu].ferme && g++<7) jourVu = (jourVu + n + 7) % 7;
    renderPlay(); };
  $('#dv-prev').onclick = () => bouge(-1);
  $('#dv-next').onclick = () => bouge(1);
  hote.querySelectorAll('.pick').forEach(b => b.onclick = () => {
    const id = b.dataset.emp;
    setCell(id, jourVu, prochainCode(p[id][jourVu]));
  });

  // glissement horizontal pour changer de jour
  let x0 = null;
  hote.ontouchstart = e => { x0 = e.touches[0].clientX; };
  hote.ontouchend = e => {
    if(x0===null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if(Math.abs(dx) > 60) bouge(dx < 0 ? 1 : -1);
  };
}

/* ---------- annuler / rétablir ---------- */
/* Pile de photos de la grille, bornée : au-delà de 60 pas en arrière,
   personne ne remonte, et la mémoire n'a pas à suivre. */


function pushHistory(){
  if(!scen) return;
  undoStack.push(snapshot());
  if(undoStack.length > HIST_MAX) undoStack.shift();
  redoStack.length = 0;
}
function resetHistory(){ undoStack = []; redoStack = []; }

function stepTo(pile, autre){
  if(!pile.length || replayInfo || !scen) return;
  autre.push(snapshot());
  plan = applyLocks(scen, Object.assign(emptyPlan(scen), pile.pop()));
  if(mode==='season'&&season) season.plan = plan;
  save(); scheduleAutosave(); renderPlay();
}
function undo(){ stepTo(undoStack, redoStack); }
function redo(){ stepTo(redoStack, undoStack); }

/* ---------- brouillons ---------- */
/* Trois emplacements manuels par épreuve, plus une reprise automatique
   à part pour qu'elle ne consomme jamais un emplacement. Rangés dans la
   progression, donc synchronisés avec le compte. */
function scenKey(){ return scen ? scen.id : null; }

function drafts(){
  progress.drafts = progress.drafts || {};
  const k = scenKey();
  if(!k) return [];
  progress.drafts[k] = progress.drafts[k] || [];
  return progress.drafts[k];
}
function autosaveOf(){
  progress.autosave = progress.autosave || {};
  return progress.autosave[scenKey()] || null;
}
function stamp(ms){
  return new Date(ms||Date.now()).toLocaleString(lang==='en'?'en-GB':'fr-FR',
    {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function snapshot(){
  const c={}; scen.equipe.forEach(em=>{ c[em.id]=plan[em.id].slice(); });
  return c;
}

let autoT=null;
function scheduleAutosave(){
  if(!scen || replayInfo || mode==='tuto') return;
  clearTimeout(autoT);
  autoT=setTimeout(()=>{
    if(!scen) return;
    progress.autosave = progress.autosave || {};
    progress.autosave[scenKey()] = { at:Date.now(), plan:snapshot() };
    save(); pushProgress();
  }, 2000);
}

function openSlots(){
  const ovl=document.createElement('div');
  ovl.className='ovl';
  const draw=()=>{
    const list=drafts(), au=autosaveOf();
    const scoreDe=pl=>evaluate(scen, applyLocks(scen, Object.assign(emptyPlan(scen), pl))).score;
    const vide=i=>`<li class="slot vide">
        <span class="sn">${t('drFree')}</span>
        <span class="sb"><button data-save="${i}">${t('drSave')}</button></span></li>`;
    const plein=(d,i,isAuto)=>{
      const sc=scoreDe(d.plan);
      const col=sc>=90?'var(--ok)':sc>=70?'var(--warn)':'var(--bad)';
      return `<li class="slot${isAuto?' auto':''}">
        <span class="sn">
          ${isAuto ? `<b style="padding-left:7px">${t('drAuto')}</b>`
                   : `<input data-name="${i}" value="${String(d.name||'').replace(/"/g,'&quot;')}" maxlength="40">`}
          <span class="sm">${d.at}</span>
        </span>
        <span class="ss" style="color:${col}">${t('drScore')(sc)}</span>
        <span class="sb">
          <button data-load="${isAuto?'auto':i}">${t('drLoad')}</button>
          ${isAuto?'':`<button data-save="${i}">${t('drOver')}</button>
                       <button class="danger" data-del="${i}">${t('drDel')}</button>`}
        </span></li>`;
    };
    const lignes=[ au ? plein({name:'',at:stamp(au.at),plan:au.plan},'auto',true)
                      : `<li class="slot auto vide"><span class="sn">${t('drAuto')} · ${t('drAutoNone')}</span></li>` ]
      .concat(Array.from({length:SLOTS},(_,i)=> list[i] ? plein(list[i],i,false) : vide(i)));
    ovl.innerHTML=`
      <div class="sheet" role="dialog" aria-modal="true" style="max-width:560px">
        <header><div class="ek">${X(scen.n)}</div><h2>${t('drTtl')}</h2></header>
        <div class="body">
          <p class="disclaim" style="border:0;padding:0">${t('drSub')}</p>
          <ul class="slots">${lignes.join('')}</ul>
        </div>
        <footer><button class="btn primary" id="sl-x" type="button">${t('dbClose')}</button></footer>
      </div>`;
    ovl.querySelector('#sl-x').onclick=()=>ovl.remove();
    ovl.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.save, l=drafts();
      l[i]={ name:(l[i]&&l[i].name)||`${X(scen.n)} · ${stamp()}`, at:stamp(), plan:snapshot() };
      save(); pushProgress(); draw(); toast(t('drSaved'));
    });
    ovl.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{
      const src = b.dataset.load==='auto' ? autosaveOf() : drafts()[+b.dataset.load];
      if(!src) return;
      pushHistory();
      plan=applyLocks(scen, Object.assign(emptyPlan(scen), src.plan));
      if(mode==='season'&&season) season.plan=plan;
      save(); ovl.remove(); renderPlay(); toast(t('drLoaded'));
    });
    ovl.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      drafts()[+b.dataset.del]=null; save(); pushProgress(); draw(); toast(t('drDeleted'));
    });
    ovl.querySelectorAll('[data-name]').forEach(inp=>{
      inp.onchange=()=>{ const l=drafts(), i=+inp.dataset.name;
        if(l[i]){ l[i].name=inp.value; save(); pushProgress(); } };
    });
  };
  draw();
  mountOvl(ovl);
}

/* ---------- débrief comparatif ---------- */
let solverWorker = null;
function getWorker(){
  if(!solverWorker){
    try{ solverWorker = new Worker('./solver-worker.js', {type:'module'}); }
    catch(_){ return null; }
  }
  return solverWorker;
}

function openAnalysis(ev){
  const kind = mode==='levels' ? 'level' : 'seed';
  const ref  = mode==='levels' ? scen.id : `${scen.seed}:${scen.diff}`;
  const w = getWorker();

  const ovl=document.createElement('div');
  ovl.className='ovl';
  const draw=(d)=>{
    const corps = !d
      ? `<p class="disclaim" style="border:0;padding:0">${t('dbWait')}</p>`
      : (()=>{
          const dp = d.refScore - d.score, de = d.cost - d.refCost;
          const titre = dp<=0 && de<=0 ? t('dbPerfect')
                      : dp>0 && de>0   ? t('dbGap')(dp, nf(de))
                      : dp>0           ? t('dbGapPts')(dp)
                                       : t('dbGapEur')(nf(de));
          const cats = Object.entries(d.perdus).filter(([,v])=>v>0)
            .sort((a,b)=>b[1]-a[1])
            .map(([k,v])=>`<li><span class="tag ${k==='legal'?'bad':k==='couv'?'warn':'info'}">-${v}</span>
                 <span>${t('dbCat')[k]}</span></li>`).join('');
          return `<div class="kpis">
              <div class="kpi"><div class="kl">${t('dbYou')}</div><div class="kv">${d.score}</div></div>
              <div class="kpi"><div class="kl">${t('dbBest')}</div><div class="kv ${d.refScore>d.score?'g':''}">${d.refScore}</div></div>
              <div class="kpi"><div class="kl">${t('dbPay')}</div><div class="kv" style="font-size:19px">${cur(d.cost)}</div></div>
              <div class="kpi"><div class="kl">${t('dbRefPay')}</div><div class="kv" style="font-size:19px">${cur(d.refCost)}</div></div>
            </div>
            <p style="margin:0">${titre}</p>
            ${cats?`<ul class="deltas">${cats}</ul>`:''}
            <p class="disclaim">${t('dbNotSure')}</p>`;
        })();
    ovl.innerHTML=`
      <div class="sheet" role="dialog" aria-modal="true">
        <header><div class="ek">${t('dbTtl')}</div><h2>${X(scen.n)}</h2></header>
        <div class="body">${corps}</div>
        <footer>
          ${d&&d.refPlan?`<button class="btn" id="db-see" type="button">${t('dbSee')}</button>`:''}
          <button class="btn primary" id="db-x" type="button">${t('dbClose')}</button>
        </footer>
      </div>`;
    ovl.querySelector('#db-x').onclick=()=>ovl.remove();
    const see=ovl.querySelector('#db-see');
    if(see) see.onclick=()=>{
      ovl.remove();
      plan=applyLocks(scen,Object.assign(emptyPlan(scen),d.refPlan));
      replayInfo={pseudo:t('dbRefName'),score:d.refScore};
      renderPlay();
    };
  };
  draw(null);
  mountOvl(ovl);

  // Repli : si le worker ne démarre pas (module non supporté, fichier
  // manquant, erreur de chargement), on calcule sur le fil principal.
  // Mieux vaut une seconde de gel qu'un panneau bloqué sur « recherche ».
  let repondu=false;
  const fallback=async()=>{
    if(repondu||!document.body.contains(ovl))return;
    repondu=true;
    try{
      const {compare}=await import('./solver.js');
      const c=compare(scen,plan,{ms:1200});
      draw({ok:true,score:c.score,refScore:c.refScore,cost:c.cost,refCost:c.refCost,
            perdus:c.perdus,refPlan:c.refPlan});
    }catch(_){ ovl.remove(); }
  };
  if(!w){ fallback(); return; }
  w.onmessage=(e)=>{
    if(!document.body.contains(ovl))return;
    if(e.data&&e.data.ok){ repondu=true; draw(e.data); }
    else fallback();
  };
  w.onerror=()=>{ solverWorker=null; fallback(); };
  setTimeout(fallback,6000);
  try{ w.postMessage({kind, ref, plan, ms:2000}); }catch(_){ fallback(); }
}
